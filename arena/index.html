<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster-Arena – Prototyp</title>
<meta name="robots" content="noindex, nofollow">
<script src="peerjs.min.js"></script>
<style>
  @font-face { font-family: Cinzel; font-weight: 700 900; font-display: swap; src: url(cinzel.woff2) format("woff2"); }
  :root {
    --grund: #121419; --panel: #1d2129; --panel2: #262b35; --linie: #3a404d;
    --text: #ece6d6; --leise: #a9a291; --gold: #e0b64c; --gold2: #8a6a1f;
    --p0: #e5483f; --p1: #3d82ff;
    --feuer: #ff6a1f; --eis: #6fd3ff; --stein: #c9a86a; --dschungel: #7ed957; --schatten: #b46bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: system-ui, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at top, #2a2f3a 0%, var(--grund) 60%) fixed, var(--grund);
  }
  h1, h2, h3, .titel { font-family: Cinzel, Georgia, serif; letter-spacing: .04em; }
  h1 { margin: 0; font-size: 1.6rem; color: var(--gold); text-shadow: 0 2px 0 #000, 0 0 18px rgba(224,182,76,.35); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .knopf {
    font: 700 1rem Cinzel, Georgia, serif; letter-spacing: .05em; color: #2a1d00; cursor: pointer;
    border: 0; border-radius: 10px; padding: 12px 20px;
    background: linear-gradient(#f3d27a, var(--gold)); box-shadow: 0 3px 0 var(--gold2), 0 0 0 1px #000;
  }
  .knopf:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold2), 0 0 0 1px #000; }

  /* ---------- Auswahl ---------- */
  #auswahl { text-align: center; }
  #auswahl h2 { margin: 18px 0 4px; font-size: 1.3rem; }
  #auswahl .unter { color: var(--leise); margin: 0 0 16px; }
  .karten { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .figurkarte {
    --el: var(--gold);
    width: 210px; background: var(--panel); border: 2px solid var(--linie); border-radius: 16px;
    overflow: hidden; cursor: pointer; text-align: left; position: relative;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .figurkarte:hover { transform: translateY(-5px); border-color: var(--el); box-shadow: 0 0 24px color-mix(in srgb, var(--el) 45%, transparent); }
  .figurkarte.vergeben { opacity: .35; filter: grayscale(.8); cursor: not-allowed; transform: none; box-shadow: none; }
  .figurkarte.vergeben::after {
    content: attr(data-vergeben); position: absolute; inset: 40% 0 auto; text-align: center;
    font: 900 1rem Cinzel, serif; background: rgba(0,0,0,.75); padding: 8px;
  }
  .portrait { height: 150px; background: #000 center / cover no-repeat; position: relative; }
  .portrait .ersatz { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; }
  .element {
    position: absolute; left: 8px; bottom: 8px; font-size: .78rem; font-weight: 700; padding: 3px 9px;
    border-radius: 999px; background: rgba(0,0,0,.7); color: var(--el); border: 1px solid var(--el);
  }
  .kartentext { padding: 10px 12px 12px; }
  .kartentext h3 { margin: 0 0 8px; font-size: 1.05rem; color: var(--el); }
  .wert { display: grid; grid-template-columns: 22px 70px 1fr; align-items: center; gap: 6px; font-size: .82rem; margin: 3px 0; }
  .pips { display: flex; gap: 2px; }
  .pips i { flex: 1; height: 7px; border-radius: 2px; background: #3a3f4a; }
  .pips i.an { background: var(--el); }
  .faehig { margin-top: 8px; font-size: .8rem; line-height: 1.35; color: var(--leise); }
  .faehig b { color: var(--text); }
  .figurkarte.gesperrt .portrait { filter: grayscale(.7) brightness(.55); }
  .schloss {
    position: absolute; left: 50%; top: 75px; transform: translate(-50%, -50%); z-index: 1; white-space: nowrap;
    font: 900 1.1rem Cinzel, serif; color: #ffd75e; background: rgba(0,0,0,.8); border: 2px solid #ffd75e;
    border-radius: 999px; padding: 6px 14px; text-shadow: 0 1px 0 #000;
  }
  .kaufzeile { margin-top: 10px; font-size: .85rem; font-weight: 700; text-align: center; padding: 8px; border-radius: 10px; background: var(--panel2); }
  .kaufzeile.kann { background: linear-gradient(#f3d27a, var(--gold)); color: #2a1d00; box-shadow: 0 3px 0 var(--gold2); }
  .sterne { margin: 2px 0 6px; font-size: .85rem; color: var(--gold); letter-spacing: 1px; }
  .sterne small { color: var(--leise); letter-spacing: 0; }
  .kaufzeile.frage { background: linear-gradient(#9dff9d, #3fbf5a); color: #062a0e; box-shadow: 0 3px 0 #1e7a32; animation: glimm 1s infinite; }
  .weltkarte .portrait { height: 170px; }
  .weltkarte .portrait::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55)); }
  .weltkarte h3 { font-size: 1.2rem; }
  .weltkarte .anzahl { font-size: .85rem; color: var(--leise); }
  .modus { display: flex; gap: 10px; justify-content: center; margin: 4px 0 14px; flex-wrap: wrap; }
.modus[hidden], .modus:empty { display: none; }
#kartenwahl { margin: 0 0 14px; }
#kartenwahl[hidden] { display: none; }
.kartenwahl-titel { font: 700 1rem Cinzel, Georgia, serif; color: var(--gold); margin-bottom: 8px; }
.kartenwahl-titel small { font: 500 .8rem system-ui, sans-serif; color: var(--leise); }
.kartenwahl-reihe { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.kartenwahl-reihe button { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; padding: 8px 8px 7px;
  font: 700 .78rem system-ui, sans-serif; color: var(--text); background: var(--panel); border: 2px solid var(--linie); border-radius: 12px; }
.kartenwahl-reihe button.an { border-color: var(--gold); box-shadow: 0 0 14px rgba(224,182,76,.35); }
.mini-karte { display: grid; grid-template-columns: repeat(8, 7px); gap: 1px; width: 63px; height: 63px; }
.mini-karte i { border-radius: 1px; }
.mini-karte.zufall { display: flex; align-items: center; justify-content: center; font-size: 34px; background: var(--panel2); border-radius: 6px; }
h1 #karteName { font-size: .9rem; color: var(--leise); text-shadow: none; }
.modus button small { font: 600 .75rem system-ui, sans-serif; opacity: .8; }
  .modus button { font: 700 1rem Cinzel, Georgia, serif; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    color: var(--text); background: var(--panel); border: 2px solid var(--linie); }
  .modus button.an { color: #2a1d00; background: linear-gradient(#f3d27a, var(--gold)); border-color: var(--gold); }
  .spielstaende { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; max-width: 760px; width: 100%; }
  .spielstand { min-height: 96px; padding: 12px; border-radius: 14px; cursor: pointer; color: var(--text);
    background: var(--panel2); border: 2px solid var(--linie); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .spielstand b { font: 700 1.15rem Cinzel, Georgia, serif; color: var(--gold); }
  .spielstand small { color: var(--leise); }
  .spielstand.leer { border-style: dashed; color: var(--leise); font-size: 1rem; }
  .spielstand.besetzt { opacity: .4; cursor: default; }
  .spielstand input { font: 700 1.05rem system-ui, sans-serif; width: 100%; padding: 8px; border-radius: 8px; border: 2px solid var(--gold); background: var(--grund); color: var(--text); text-align: center; }
  .spielstand .knopf { padding: 6px 14px; margin-top: 4px; }
  .anderer { display: block; margin: 10px auto 0; font: 700 .95rem Cinzel, Georgia, serif; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    color: var(--text); background: var(--panel2); border: 2px solid var(--linie); }
  .weltkarte .waehlzeile { margin-top: 10px; font-size: .85rem; font-weight: 700; text-align: center; padding: 8px; border-radius: 10px; background: var(--panel2); }
  .weltkarte .waehlzeile.frage { background: linear-gradient(#9dff9d, #3fbf5a); color: #062a0e; box-shadow: 0 3px 0 #1e7a32; animation: glimm 1s infinite; }

  /* ---------- Spiel ---------- */
  #spiel { display: none; }
  /* ---------- Solo: große Welt im Nebel ---------- */
  #solo { display: none; text-align: center; }
  #soloBrett {
    width: min(94vw, 660px); aspect-ratio: 1; margin: 10px auto; display: grid; border-radius: 10px; overflow: hidden;
    grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
    background: #3d5a2c url(bilder/boden.jpg) center / cover; box-shadow: 0 0 0 2px var(--linie), 0 8px 30px rgba(0,0,0,.6);
  }
  #soloBrett .feld { cursor: pointer; }
  #soloBrett .feld.erinnert > * { filter: brightness(.45) saturate(.5); }
  #soloBrett .feld.erinnert { background: rgba(0,0,0,.5); }
  #soloBrett .feld.nebel { background: radial-gradient(circle at 40% 35%, #8a90a0, #4b505c 70%); box-shadow: none; }
  #soloBrett .feld.nebel::after { content: ""; position: absolute; inset: -30%; background: radial-gradient(circle, rgba(200,205,215,.35), transparent 60%); }
  #soloBrett .feld.rand { background: #0b0c10; box-shadow: none; }
  #soloBrett .figur { position: absolute; inset: 6%; }
  #soloInfo { color: var(--leise); }
  #soloBrett .truhe { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(5vw, 34px); z-index: 2; filter: drop-shadow(0 2px 3px #000); }
  #soloBrett .muenze { font-size: min(3.2vw, 22px); }
  .feld.mauer { background: repeating-linear-gradient(0deg, #5a4a36 0 46%, #2c241a 46% 50%, #6b5940 50% 96%, #2c241a 96%); box-shadow: inset 0 0 0 2px #2c241a; }
  .kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding-left: 62px; }

  /* ---------- Pokal-Weg ---------- */
  #pokalKnopf {
    position: fixed; top: 10px; left: 10px; z-index: 41; width: 54px; height: 54px; border-radius: 14px; cursor: pointer;
    font-size: 28px; line-height: 1; border: 2px solid var(--gold); background: var(--panel); box-shadow: 0 3px 0 var(--gold2), 0 0 0 1px #000;
  }
  #pokalKnopf[hidden] { display: none; }
  /* Zurück oben links; der Pokal-Knopf rückt dann ein Stück nach rechts */
  #zurueckKnopf { position: fixed; top: 10px; left: 10px; z-index: 39; min-width: 54px; height: 54px; padding: 0 12px; border-radius: 14px; cursor: pointer;
    font: 700 1.6rem system-ui, sans-serif; color: var(--text); border: 2px solid var(--linie); background: var(--panel); box-shadow: 0 3px 0 #000; }
  #zurueckKnopf[hidden] { display: none; }
  #zurueckKnopf.frage { font-size: 1rem; color: #062a0e; background: linear-gradient(#9dff9d, #3fbf5a); border-color: #3fbf5a; z-index: 42; }
  body.mit-zurueck #pokalKnopf { left: 74px; }
  body.mit-zurueck .kopf { padding-left: 128px; }
  #pokalKnopf small { position: absolute; right: -8px; bottom: -8px; min-width: 24px; padding: 2px 5px; border-radius: 999px;
    font: 800 .72rem system-ui, sans-serif; color: #2a1d00; background: var(--gold); border: 1px solid #000; }
  #pokalKnopf.geschenk small { animation: pochen 1s ease-in-out infinite; }
  #pokalKnopf.offen { background: var(--gold); }
  @keyframes pochen { 50% { transform: scale(1.25); } }
  #pokalWeg { display: none; position: fixed; inset: 0; z-index: 40; overflow-y: auto; padding: 80px 16px 40px;
    background: radial-gradient(ellipse at top, #3a3220 0%, var(--grund) 70%) fixed, var(--grund); }
  #pokalWeg.an { display: block; }
  #pokalWeg h2 { text-align: center; color: var(--gold); margin: 0 0 4px; }
  #pokalWeg .unter { text-align: center; color: var(--leise); margin: 0 0 14px; font-size: .9rem; }
  .weg { position: relative; width: max-content; margin: 0 auto; padding: 8px 0; }
  .weg .linie { position: absolute; left: 14px; top: calc(8px + 0.5cm); width: 4px; background: #3a404d; border-radius: 2px; }
  .weg .linie i { position: absolute; left: 0; top: 0; width: 100%; background: linear-gradient(#ffd75e, var(--gold)); border-radius: 2px; }
  .weg .punkt { position: relative; height: 1cm; display: flex; align-items: center; gap: 12px; }
  .weg .punkt b { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 17px; background: var(--panel2); border: 2px solid var(--linie); opacity: .55; }
  .weg .punkt span { font-size: .85rem; color: var(--leise); }
  .weg .punkt.erreicht b { opacity: 1; border-color: var(--gold); }
  .weg .punkt.bereit b { opacity: 1; cursor: pointer; border-color: #ffd75e; background: var(--gold2); box-shadow: 0 0 14px #ffd75e; animation: pochen 1s ease-in-out infinite; }
  .weg .punkt.bereit span { color: #ffd75e; font-weight: 700; cursor: pointer; }
  .weg .punkt.abgeholt b { opacity: .8; filter: grayscale(.6); }
  .weg .stand { position: absolute; right: calc(100% + 6px); z-index: 1; font: 800 .8rem system-ui, sans-serif; color: #2a1d00; background: #ffd75e;
    padding: 2px 8px; border-radius: 999px; transform: translateY(-50%); white-space: nowrap; }
  #suche { display: none; position: fixed; inset: 0; z-index: 35; background: rgba(10,12,16,.92); align-items: center; justify-content: center; padding: 16px; }
  #suche.an { display: flex; }
  #suche .box { background: var(--panel); border: 2px solid var(--gold); border-radius: 20px; padding: 26px 30px; text-align: center; max-width: 380px; }
  #suche h2 { color: var(--gold); margin: 8px 0; }
  #suche p { color: var(--leise); margin: 0 0 18px; }
  #suche .globus { font-size: 64px; animation: dreh 4s linear infinite; display: inline-block; }
  #geschenkAuf { display: none; position: fixed; inset: 0; z-index: 42; background: rgba(0,0,0,.7); align-items: center; justify-content: center; padding: 16px; cursor: pointer; }
  #geschenkAuf.an { display: flex; }
  #geschenkAuf .box { background: var(--panel); border: 2px solid var(--gold); border-radius: 20px; padding: 24px 32px; text-align: center; max-width: 360px; }
  #geschenkAuf .gross { font-size: 64px; animation: stempel .5s both; }
  #zuganzeige { font: 900 1.05rem Cinzel, serif; padding: 7px 16px; border-radius: 999px; color: #fff; text-shadow: 0 1px 2px #000; }
  .buehne { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  #rahmen {
    --g: min(92vw, 74vh, 620px);
    position: relative; flex-shrink: 0; padding: 10px; border-radius: 14px;
    background: linear-gradient(145deg, #5b5446, #2b2720 55%, #4a4336);
    box-shadow: 0 0 0 2px #000, inset 0 0 0 2px var(--gold2), 0 14px 40px rgba(0,0,0,.6);
  }
  #effekte { position: absolute; inset: 10px; pointer-events: none; z-index: 5; }
  #brett {
    width: var(--g); height: var(--g); display: grid;
    grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    border-radius: 6px; overflow: hidden;
    background: #3d5a2c url(bilder/boden.jpg) center / cover;
  }
  .feld {
    position: relative; display: flex; align-items: center; justify-content: center; user-select: none;
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.35);
  }
  .feld.dunkel { background: rgba(0,0,0,.12); }
  .boden-flach { position: absolute; inset: 0; background: center / cover; box-shadow: inset 0 0 10px rgba(0,0,0,.55); }
  .boden-rund {
    position: absolute; inset: 2%; border-radius: 50%; background: center / 125%;
    -webkit-mask-image: radial-gradient(circle, #000 55%, transparent 72%);
            mask-image: radial-gradient(circle, #000 55%, transparent 72%);
  }
  .feld.see .boden-flach { background-color: #1e4f6e; }
  .feld.lava .boden-flach { background-color: #7a2a0a; animation: gluehen 2.4s ease-in-out infinite; }
  @keyframes gluehen { 50% { filter: brightness(1.4) saturate(1.2); } }
  .feld.eis .boden-flach { background-color: #bfe6f5; }
  .feld.eis::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.45) 50%, transparent 60%) 0 0 / 300% 100%;
    animation: glanz 4.5s linear infinite;
  }
  @keyframes glanz { from { background-position: 150% 0; } to { background-position: -150% 0; } }
  .feld.busch .boden-rund { background-color: #24502a; }
  .feld.fels .boden-rund { inset: -3%; background-color: #6d675c; }
  .feld.portal .boden-rund { background-color: #2a1240; animation: wirbel 7s linear infinite; }
  @keyframes wirbel { to { transform: rotate(360deg); } }
  .feld.quelle .boden-rund { background-color: #2a8c8c; animation: gluehen 3s ease-in-out infinite; }
  .kugel {
    position: absolute; z-index: 2; width: 36%; height: 36%; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #9ff 28%, #3a7bff 60%, #1a2a8a);
    box-shadow: 0 0 12px 4px rgba(120,200,255,.9), 0 0 30px 8px rgba(80,140,255,.45);
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--g) / 8 * .2);
    animation: kugel 1.6s ease-in-out infinite;
  }
  @keyframes kugel { 50% { transform: translateY(-14%) scale(1.1); box-shadow: 0 0 18px 7px rgba(140,220,255,1), 0 0 40px 14px rgba(80,140,255,.6); } }
  #ambiente {
    position: absolute; inset: 10px; pointer-events: none; z-index: 4; overflow: hidden; border-radius: 6px;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.4));
  }
  #ambiente i {
    position: absolute; width: 4px; height: 4px; border-radius: 50%; opacity: 0;
    background: #ffe9a8; box-shadow: 0 0 6px 2px rgba(255,220,120,.7);
    animation: schweben var(--d) linear var(--v) infinite;
  }
  @keyframes schweben { 0% { opacity: 0; transform: none; } 20% { opacity: .8; } 100% { opacity: 0; transform: translate(var(--x), -140px); } }
  .gl-zeile { display: flex; gap: 9px; align-items: center; margin: 5px 0; }
  .gl-bild { width: 30px; height: 30px; border-radius: 7px; background: #3d5a2c center / cover; flex-shrink: 0; box-shadow: 0 0 0 1px #000; }
  .knopf.spezial {
    display: none; color: #071a40; background: linear-gradient(#c9ecff, #4a8cff);
    box-shadow: 0 3px 0 #1f4fa8, 0 0 0 1px #000, 0 0 18px rgba(90,160,255,.8); animation: knistern 1.2s infinite;
  }
  .knopf.spezial.an { display: inline-block; }
  .knopf.spezial:disabled { animation: none; opacity: .5; cursor: default; }
  @keyframes knistern { 50% { box-shadow: 0 3px 0 #1f4fa8, 0 0 0 1px #000, 0 0 28px 6px rgba(120,200,255,1); } }
  .zahl.heil { color: #7dff9a; }
  .zahl.blitz { color: #9fe3ff; }
  .feld.ziel { cursor: pointer; }
  .feld.ziel::after {
    content: ""; position: absolute; inset: 30%; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle, rgba(255,226,140,.95), rgba(224,182,76,.35) 60%, transparent 72%);
    animation: glimm 1.4s ease-in-out infinite;
  }
  .feld.ziel:hover::after { inset: 18%; }
  @keyframes glimm { 50% { opacity: .55; } }
  .figur {
    position: relative; z-index: 2; width: 84%; height: 84%; border-radius: 50%;
    background: #000 center / cover no-repeat; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--g) / 8 * .45);
  }
  .figur.p0 { box-shadow: 0 0 0 3px var(--p0), 0 0 0 5px #000, 0 6px 10px rgba(0,0,0,.6); }
  .figur.p1 { box-shadow: 0 0 0 3px var(--p1), 0 0 0 5px #000, 0 6px 10px rgba(0,0,0,.6); }
  .figur.aktiv { animation: hupf 1s ease-in-out infinite; }
.figur.imBusch { opacity: .45; }
  @keyframes hupf { 50% { transform: translateY(-7%); } }
  .figur.getroffen { animation: wackel .4s; }
  @keyframes wackel { 25% { transform: translateX(-10%); } 75% { transform: translateX(10%); } }
  .feld.angreifbar { cursor: pointer; }
  .feld.angreifbar .figur { animation: zielen .8s infinite; }
  @keyframes zielen { 50% { box-shadow: 0 0 0 3px #ff2b2b, 0 0 0 6px #000, 0 0 22px 8px rgba(255,40,40,.8); } }
  .marke { position: absolute; font-size: calc(var(--g) / 8 * .22); right: -4%; top: -4%; filter: drop-shadow(0 1px 1px #000); }
  .zahl {
    position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
    font: 900 calc(var(--g) / 8 * .32) Cinzel, serif; color: #fff;
    text-shadow: 0 2px 0 #000, 0 0 8px #000; animation: steig 1.1s forwards;
  }
  .zahl.miss { color: #cfd6e0; font-size: calc(var(--g) / 8 * .22); }
  @keyframes steig { to { transform: translate(-50%, -170%); opacity: 0; } }

  .seite { flex: 1; min-width: 270px; display: flex; flex-direction: column; gap: 12px; }
  .spielerbox { --el: var(--gold); background: var(--panel); border-radius: 14px; padding: 10px; border: 2px solid var(--linie); }
  .spielerbox.dran { border-color: var(--gold); box-shadow: 0 0 18px rgba(224,182,76,.25); }
  .spielerbox .zeile { display: flex; align-items: center; gap: 12px; }
  .spielerbox .mini { width: 58px; height: 58px; border-radius: 50%; background: #000 center / cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .spielerbox .name { font: 700 .95rem Cinzel, serif; color: var(--el); }

// ---------- Online (PeerJS) ----------
// Der Gratis-Dienst von PeerJS stellt nur den Kontakt her, danach spielen die Geräte direkt miteinander.
// Wer sucht, versucht der Reihe nach feste Warteplätze (LOBBY + 1 … PLAETZE): Ist der Platz frei, belegt er ihn und
// wartet; ist er belegt, fragt er den Wartenden an. Wer weiter hinten wartet, schaut regelmäßig nach vorne,
// damit sich zwei Wartende finden. Beide Geräte rechnen den Kampf selbst – mit demselben Zufall (Startwert vom
// Gastgeber) und denselben Zügen in derselben Reihenfolge. Übers Netz gehen nur Monsterwahl und Spielerklicks.
const LOBBY = `monsterarena-x7k2-${new URLSearchParams(location.search).get("lobby") || "platz"}-`;   // ?lobby=… zum Testen
const PLAETZE = 8;
let ich = 0, peer = null, verbindung = null, suchLauf = 0, onlineBoni = [null, null];
let zufallStand = 0;
// Zufall für Spielregeln: online mit gemeinsamem Startwert (mulberry32), sonst wie bisher
function zufall() {
  if (!online) return Math.random();
  zufallStand = (zufallStand + 0x6D2B79F5) | 0;
  let t = Math.imul(zufallStand ^ (zufallStand >>> 15), 1 | zufallStand);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function zeigeSuche(text, unter = "") {
  document.getElementById("suche").classList.add("an");
  document.getElementById("sucheText").textContent = text;
  document.getElementById("sucheUnter").textContent = unter;
}
function neuerPeer(id) {
  return new Promise(fertig => {
    const p = id ? new Peer(id) : new Peer();
    p.on("open", () => fertig({ p }));
    p.on("error", e => fertig({ p, fehler: e.type }));
  });
}
// Fragt den Wartenden auf Platz k an: Verbindung bei „hallo“, sonst null (besetzt, weg, keine Antwort)
function frageAn(gast, k) {
  return new Promise(fertig => {
    const c = gast.connect(LOBBY + k, { reliable: true });
    const t = setTimeout(() => { c.close(); fertig(null); }, 6000);
    c.on("data", d => {
      if (d.typ === "hallo") { clearTimeout(t); fertig(c); }
      else if (d.typ === "besetzt") { clearTimeout(t); c.close(); fertig(null); }
    });
    c.on("error", () => { clearTimeout(t); fertig(null); });
  });
}
async function sucheGegner() {
  const lauf = ++suchLauf;
  if (typeof Peer === "undefined") return zeigeSuche("Online geht hier nicht", "Das Spiel muss dafür im Internet geöffnet sein.");
  zeigeSuche("Suche einen Gegner …", "Gleich geht's los, sobald noch jemand Online spielen will.");
  let gast = null;
  for (let k = 1; k <= PLAETZE; k++) {
    const { p, fehler } = await neuerPeer(LOBBY + k);
    if (lauf !== suchLauf) return p.destroy();
    if (!fehler) return wirdGastgeber(p, k, lauf, gast);
    p.destroy();
    if (fehler !== "unavailable-id") return zeigeSuche("Keine Verbindung 😕", "Ist das Internet an? Geh zurück und versuch es nochmal.");
    if (!gast) {
      const r = await neuerPeer();
      if (lauf !== suchLauf) return r.p.destroy();
      if (r.fehler) return zeigeSuche("Keine Verbindung 😕", "Ist das Internet an? Geh zurück und versuch es nochmal.");
      gast = r.p;
    }
    const c = await frageAn(gast, k);
    if (lauf !== suchLauf) return gast.destroy();
    if (c) { peer = gast; return verbunden(c, false); }
  }
  gast?.destroy();
  zeigeSuche("Gerade ist alles voll", "Ich versuche es gleich nochmal …");
  setTimeout(() => lauf === suchLauf && sucheGegner(), 5000);
}
function wirdGastgeber(p, k, lauf, gast) {
  peer = p;
  zeigeSuche("Warte auf einen Gegner …", "Sobald noch jemand Online spielen will, geht's los.");
  p.on("connection", c => c.on("open", () => {
    if (verbindung || lauf !== suchLauf) { c.send({ typ: "besetzt" }); setTimeout(() => c.close(), 300); return; }
    c.send({ typ: "hallo" });
    gast?.destroy();
    verbunden(c, true);
  }));
  p.on("disconnected", () => { if (!verbindung && lauf === suchLauf) p.reconnect(); });

// Wartet jemand auf einem Platz weiter vorne (der war vorhin besetzt)? Dann dorthin wechseln.
async function nachVorneSchauen(k, lauf, gast) {

  if (verbindung || lauf !== suchLauf) return;
  if (!gast) { const r = await neuerPeer(); if (r.fehler) return nachVorneSchauen(k, lauf, null); gast = r.p; }
  for (let j = 1; j < k; j++) {
    const c = await frageAn(gast, j);
    if (verbindung || lauf !== suchLauf) { c?.close(); return; }
    if (c) { peer.destroy(); peer = gast; return verbunden(c, false); }
  }
  nachVorneSchauen(k, lauf, gast);
}
function sucheAbbrechen() {
  suchLauf++;

}
function verbunden(c, gastgeber) {

  c.on("close", gegnerWeg);
  zeigeSuche("Gegner gefunden! ⚔️", "Gleich geht's los …");
  // Der Gast schickt zuerst seine Wahl, der Gastgeber antwortet mit seiner Wahl und dem Startwert für den Zufall

}
const meineWahl = () => ({ id: wahl[0], kugel: pokal[0].kugel > 0, leben: pokal[0].leben > 0, level: levelVon(0, wahl[0]), name: spielstandName(0) });
function empfange(d) {

    const ihre = { id: d.id, kugel: !!d.kugel, leben: !!d.leben, level: gueltigesLevel(d.level), name: sauberName(d.name) };   // ältere Geräte schicken kein Level (→ 1) und keinen Namen
    if (!FIGUREN[ihre.id]) return;
    let start, karte;

// Zurück-Knopf oben links → Startseite mit Modus, Schwierigkeit und Kampf-Karte.
// Im Kampf bricht er ab (wie beim Kaufen: erstes Tippen fragt, zweites geht); zu zweit bei Spieler 2 geht es zu Spieler 1.
function zeigeZurueck() {
  const sichtbar = spieler.length > 0 || !!solo || (wahl.length === 1 && !allein()) || (wahl.length === 0 && sitz[0] !== null);

function zurueck(knopf) {

  if (!spieler.length) {

function gegnerWeg() {

// ---------- Zustand ----------
let spieler = [];          // {id, fig, r, c, leben, gift, frost}

// ---------- Bilder mit Ersatz-Emoji, falls die Datei fehlt ----------
const bildDa = {};
for (const [id, f] of Object.entries(FIGUREN)) {

for (const id of Object.keys(FIGUREN)) for (const sit of ["kampf", "volltreffer", "besiegt"]) {

function szene(id, sit) { return `bilder/szenen/${id}_${sit}.jpg`; }

for (const id of Object.keys(FIGUREN)) for (let n = 2; n <= MAX_LEVEL; n++) {

const levelBild = (id, n) => n > 1 && bildDa[id + "_l" + n] ? `bilder/${id}_l${n}.jpg` : FIGUREN[id].bild;

// Manga-Einblendung: tafeln = [{id, sit}], gibt ein Promise zurück (Tippen = weiter)
function cutin(tafeln, ruf, el, dauer = 2200) {
  tafeln = tafeln.filter(t => bildDa[t.id + "_" + t.sit]);

  const c = document.getElementById("cutin");
  const reihe = tafeln.map((t, i) =>
    `<div class="tafel${i ? " rechts" : ""}" style="--el:${FIGUREN[t.id].farbe};background-image:url(${szene(t.id, t.sit)})"></div>`).join("");
  const text = tafeln.length > 1 ? `<div class="vs">VS</div><div class="ruf oben" style="--el:var(--gold2)">${ruf}</div>`

const feldTyp = (r, c) => KARTE[r][c];
const imFeld = (r, c) => r >= 0 && c >= 0 && r < N && c < N;
const abstand = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
// Versteck im Busch: Wer im Dickicht steht, ist für den Gegner unsichtbar – außer der steht direkt daneben
// oder ist in diesem Zug gegen den Busch gelaufen (entdeckt). Wer aus dem Busch angreift, verrät sich, bis er weiterläuft.
let entdeckt = -1;
const imBusch = p => feldTyp(p.r, p.c) === "B";
const nebenan = (a, b) => Math.max(Math.abs(a.r - b.r), Math.abs(a.c - b.c)) <= 1;   // auch schräg daneben

const kampfAbstand = (a, b) => nebenan(a, b) ? 1 : abstand(a, b);
const versteckt = i => imBusch(spieler[i]) && !spieler[i].verraten && !nebenan(spieler[i], spieler[1 - i]) && entdeckt !== i;
function verrate(a) {
  if (!imBusch(a) || a.verraten) return;

const schritteVon = s => (s.frost || s.glatt ? 1 : s.fig.schritte);
const istEl = (s, el) => s.fig.element === el;
function reichweiteVon(s) {
  const t = feldTyp(s.r, s.c);

}

function erreichbar(s) {
  const gegner = spieler[1 - spieler.indexOf(s)];
  const max = schritteVon(s);
  const kosten = new Map([[s.r + "," + s.c, 0]]);
  const q = [[s.r, s.c, 0]];
  while (q.length) {
    const [r, c, d] = q.shift();
    if (d > kosten.get(r + "," + c)) continue;
    const nachbarn = [[r + 1, c, 1], [r - 1, c, 1], [r, c + 1, 1], [r, c - 1, 1]];
    if (feldTyp(r, c) === "P") {                         // Portal: verbunden mit dem anderen
      const [pr, pc] = PORTALE.find(([a, b]) => a !== r || b !== c);
      nachbarn.push([pr, pc, istEl(s, "Schatten") ? 0 : 1]);
    }
    for (const [nr, nc, k] of nachbarn) {
      const key = nr + "," + nc, nd = d + k;
      if (!imFeld(nr, nc) || nd > max || nd >= (kosten.get(key) ?? 99)) continue;
      if (!s.fig.fliegt && gesperrtFuer(s, nr, nc)) continue; // Wasser: niemand, Felsen: nur Stein – Flieger drüber weg
      if (nr === gegner.r && nc === gegner.c && !versteckt(spieler.indexOf(gegner))) continue; // versteckt: Feld sieht frei aus
      kosten.set(key, nd);
      k === 0 ? q.unshift([nr, nc, nd]) : q.push([nr, nc, nd]);
    }
  }
  kosten.delete(s.r + "," + s.c);
  return new Set([...kosten.keys()].filter(k => !gesperrtFuer(s, ...k.split(",").map(Number))));
}
function gesperrtFuer(s, r, c) {
  const t = feldTyp(r, c);
  return t === "S" || (t === "F" && !istEl(s, "Stein"));
}

// Hornstoß: Gegner 1 Feld vom Angreifer weg, wenn dort Platz ist
function wegstossen(a, z) {
  const r = z.r + Math.sign(z.r - a.r), c = z.c + Math.sign(z.c - a.c);
  if (!imFeld(r, c) || gesperrtFuer(z, r, c) || (r === a.r && c === a.c)) return;
  const [vr, vc] = [z.r, z.c];
  z.r = r; z.c = c;
  log(`💥 ${z.fig.name} wird weggeschleudert!`);
  zeichne();
  gleite(spieler.indexOf(z), vr, vc);
}

function kannAngreifen() {
  return !angegriffen && !versteckt(1 - dran) && kampfAbstand(spieler[dran], spieler[1 - dran]) <= reichweiteVon(spieler[dran]);
}
function kannSpezial() {
  const s = spieler[dran];
  return !angegriffen && s.ladung && !versteckt(1 - dran) && kampfAbstand(s, spieler[1 - dran]) <= s.fig.spezial.reichweite;
}

function aendereLeben(s, n, text) {
  const vorher = s.leben;
  s.leben = Math.max(0, Math.min(s.max, s.leben + n));
  if (s.leben === vorher) return;
  log(text);
  zeichne();
  zahl(s, (n > 0 ? "+" : "") + (s.leben - vorher), n < 0, false, n > 0 ? "heil" : "");
}

function zugStart() {
  bewegt = false; angegriffen = false; entdeckt = -1;
  const s = spieler[dran];
  const t = feldTyp(s.r, s.c);
  s.glatt = t === "E" && !istEl(s, "Eis");
  zeichne();
  if (s.frost) log(`❄️ ${s.fig.name} ist eingefroren und läuft nur 1 Feld.`);
  if (s.glatt) log(`❄️ ${s.fig.name} steht auf glattem Eis und läuft nur 1 Feld.`);
  if (t === "L") istEl(s, "Feuer") ? aendereLeben(s, 1, `🔥 Die Lava stärkt ${s.fig.name}: +1 Leben.`)
                                   : aendereLeben(s, -1, `🔥 Die Lava brennt: ${s.fig.name} verliert 1 Leben.`);
  if (t === "Q") aendereLeben(s, 2, `✨ Die Lebensquelle heilt ${s.fig.name}: +2 Leben.`);
  if (t === "B" && istEl(s, "Dschungel")) aendereLeben(s, 1, `🌿 Das Dickicht heilt ${s.fig.name}: +1 Leben.`);
  if (s.gift > 0) {
    s.gift--;
    aendereLeben(s, -1, `☠️ Das Gift wirkt: ${s.fig.name} verliert 1 Leben.`);
  }
  if (pruefeSieg()) return;
  zeichne();
  if (kiDran()) kiZug();
}

function neueKugel() {
  const frei = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (feldTyp(r, c) !== "." || kugeln.some(([a, b]) => a === r && b === c)) continue;
    if (spieler.some(p => abstand(p, { r, c }) < 2)) continue;
    frei.push([r, c]);
  }
  if (!frei.length) return;
  kugeln.push(frei[Math.floor(zufall() * frei.length)]);
  log("⚡ Eine neue Blitzkugel ist erschienen!");
  ton("kugel");
}

function zugEnde() {
  if (sperre) return;
  if (++zuege % 4 === 0 && kugeln.length < 2) neueKugel();
  spieler[dran].frost = false;
  dran = 1 - dran;
  zugStart();
}

function klickFeld(r, c, vonAussen) {   // vonAussen: Computer oder Online-Gegner
  if (sperre || (nichtMeinZug() && !vonAussen)) return;
  const s = spieler[dran], g = spieler[1 - dran];
  if (r === g.r && c === g.c && kannAngreifen()) return angriff();
  if (!bewegt && r === g.r && c === g.c && versteckt(1 - dran)) {   // gegen den Busch gelaufen: Versteck aufgeflogen
    entdeckt = 1 - dran;
    ton("klick");
    log(`👀 Im Busch versteckt sich ${g.fig.name}!`);
    zeichne();
    zahl(g, "👀 entdeckt!", false, false);
    return;
  }
  if (!bewegt && erreichbar(s).has(r + "," + c)) {
    const [vr, vc] = [s.r, s.c];
    s.r = r; s.c = c; bewegt = true; s.verraten = false;
    ton("schritt");
    const t = feldTyp(r, c);
    log(`${s.fig.name} läuft${t !== "." ? " auf: " + GELAENDE[t].name : ""}.`);
    const k = kugeln.findIndex(([a, b]) => a === r && b === c);
    if (k >= 0 && !s.ladung) {
      kugeln.splice(k, 1);
      s.ladung = true;
      log(`⚡ ${s.fig.name} sammelt eine Blitzkugel: ${s.fig.spezial.name} ist bereit!`);
      setTimeout(() => { ton("kugel"); zahl(s, "⚡ " + s.fig.spezial.name, false, false, "blitz"); }, 300);
    }
    weiterOderEnde();
    gleite(dran, vr, vc);
  }
}

function angriff() {
  sperre = true;
  zeichne();
  const a = spieler[dran], z = spieler[1 - dran];
  verrate(a);
  const w = document.getElementById("wuerfel");
  w.classList.add("rollt");
  ton("wuerfel");
  let i = 0;
  const t = setInterval(() => { w.textContent = 1 + Math.floor(Math.random() * 6); if (++i > 8) fertig(); }, 70);
  async function fertig() {
    clearInterval(t);
    w.classList.remove("rollt");
    const wurf = 1 + Math.floor(zufall() * 6);
    w.textContent = wurf;
    angegriffen = true;
    if (wurf === 6) gibPokale(dran, 1, a);
    const busch = feldTyp(z.r, z.c) === "B" && !a.fig.durchBusch;
    const schutz = busch || z.fig.spuk;
    const daneben = wurf === 1 || (schutz && wurf === 2);
    if (daneben) {
      ton("daneben");
      const grund = wurf === 1 ? "!" : busch ? " – der Busch schützt!" : ` – ${z.fig.name} weicht wie Nebel aus!`;
      log(`🎲 ${wurf}: ${a.fig.angriffName} geht daneben${grund}`);
      zahl(z, "daneben", false, true);
    } else {
      if (wurf === 6) {
        document.body.classList.add("bebt");
        setTimeout(() => document.body.classList.remove("bebt"), 500);
        await cutin([{ id: a.id, sit: "volltreffer" }], `${a.fig.angriffName}!<br>Volltreffer!`, a.fig.farbe);
      }
      let schaden = wurf === 6 ? a.fig.angriff * 2 : a.fig.angriff;
      if (a.fig.anlauf && bewegt) schaden += a.fig.anlauf;
      if (z.fig.panzer) schaden = Math.max(1, schaden - z.fig.panzer);
      z.leben = Math.max(0, z.leben - schaden);
      ton(wurf === 6 ? "volltreffer" : "treffer");
      log(`🎲 ${wurf}: ${a.fig.angriffName} trifft${wurf === 6 ? " voll" : ""}! ${z.fig.name} verliert ${schaden} Leben${z.fig.panzer ? " (Panzer)" : ""}${a.fig.anlauf && bewegt ? " (Jagdsprung)" : ""}.`);
      if (z.leben > 0 && a.fig.gift) { z.gift = a.fig.gift; log(`☠️ ${z.fig.name} ist vergiftet.`); }
      if (z.leben > 0 && a.fig.friert) { z.frost = true; log(`❄️ ${z.fig.name} friert ein.`); }
      zahl(z, "-" + schaden, true);
      if (z.leben > 0 && a.fig.stoss) wegstossen(a, z);
      if (a.fig.saugt) setTimeout(() => aendereLeben(a, a.fig.saugt, `🦇 ${a.fig.name} saugt Kraft: +${a.fig.saugt} Leben.`), 350);
      if (z.leben > 0 && z.fig.dornen) aendereLeben(a, -z.fig.dornen, `🌵 ${a.fig.name} sticht sich am Dornenfell: -${z.fig.dornen} Leben.`);
    }
    sperre = false;
    if (pruefeSieg()) return;
    weiterOderEnde();
  }
}

async function spezialAngriff() {
  if (sperre || !kannSpezial()) return;
  sperre = true;
  const a = spieler[dran], z = spieler[1 - dran], sp = a.fig.spezial;
  a.ladung = false;
  verrate(a);
  angegriffen = true;
  zeichne();
  document.body.classList.add("bebt");
  setTimeout(() => document.body.classList.remove("bebt"), 500);
  await cutin([{ id: a.id, sit: "volltreffer" }], `⚡ ${sp.name}!`, a.fig.farbe);
  let schaden = sp.schaden;
  if (z.fig.panzer) schaden = Math.max(1, schaden - z.fig.panzer);
  z.leben = Math.max(0, z.leben - schaden);
  ton("volltreffer");
  log(`⚡ ${sp.name} trifft! ${z.fig.name} verliert ${schaden} Leben${z.fig.panzer ? " (Panzer)" : ""}.`);
  zeichne();
  zahl(z, "-" + schaden, true);
  if (z.leben > 0 && sp.gift) { z.gift = sp.gift; log(`☠️ ${z.fig.name} ist für ${sp.gift} Runden vergiftet.`); }
  if (z.leben > 0 && sp.frost) { z.frost = true; log(`❄️ ${z.fig.name} friert ein.`); }
  if (sp.heil) setTimeout(() => aendereLeben(a, sp.heil, `💜 ${a.fig.name} raubt Kraft: +${sp.heil} Leben.`), 400);
  sperre = false;
  if (pruefeSieg()) return;
  const zug = zuege;
  setTimeout(() => zug === zuege && weiterOderEnde(), 500);
}

// Automatisches Zugende höchstens einmal je Zug: Läuft der Computer in den 500 ms nach einem Spezialangriff,
// prüfen zwei Stellen – ohne die Zugnummer endeten zwei Züge und der Spieler wurde übersprungen.
let endeGeplant = -1;
function weiterOderEnde() {
  zeichne();
  const s = spieler[dran];
  const nochZiehen = !bewegt && erreichbar(s).size > 0;
  if (!nochZiehen && !kannAngreifen() && !kannSpezial() && endeGeplant !== zuege) {
    const zug = endeGeplant = zuege;
    sperre = true;
    setTimeout(() => { if (zug !== zuege) return; sperre = false; zugEnde(); }, 800);
  }
}

function pruefeSieg() {
  const tot = spieler.findIndex(s => s.leben <= 0);
  if (tot < 0) return false;
  if (vorbei) return true;
  vorbei = true;
  sperre = true;
  zeichne();
  const sieger = spieler[1 - tot];
  ton("sieg");
  const b = document.getElementById("siegBild");
  b.setAttribute("style", bildDa[sieger.id + "_kampf"] ? `background-image:url(${szene(sieger.id, "kampf")})` : portraitStil(sieger.id, sieger.fig.level));
  b.textContent = ersatz(sieger.id);
  const gewinner = 1 - tot;
  soloKampfEnde(gewinner);
  const k = profil(gewinner);
  document.getElementById("siegText").textContent = online
    ? (gewinner === ich ? `Du gewinnst mit ${sieger.fig.name}!` : `Dein Gegner gewinnt mit ${sieger.fig.name}!`)
    : computer && gewinner === 1 ? `Der Computer gewinnt mit ${sieger.fig.name}!` : `${nameVon(gewinner)} gewinnt mit ${sieger.fig.name}!`;
  if (k < 0) {
    document.getElementById("siegGeld").innerHTML = `<small>Diesmal kein Geld – versuch es nochmal!</small>`;
  } else {
    geld[k] += praemie(gewinner);
    speichereGeld();
    setTimeout(() => ton("geld"), 850);                  // nach der Sieg-Fanfare
    log(`💰 ${nameVon(gewinner)} bekommt ${praemie(gewinner)} €!`);
    gibPokale(gewinner, 2);
    document.getElementById("siegGeld").innerHTML = `💰 +${praemie(gewinner)} € · 🏆 +2<small>${online ? "Du hast" : `${nameVon(gewinner)} hat`} jetzt ${geld[k]} € und ${pokal[k].pokale} 🏆${offeneGeschenke(k) > 0 ? " – 🎁 ein Geschenk wartet!" : ""}</small>`;
  }
  if (online) { const v = verbindung; verbindung = null; setTimeout(() => { v?.close(); peer?.destroy(); }, 1500); }   // Kampf vorbei: Leitung frei
  const verlierer = spieler[tot];
  setTimeout(() => cutin([{ id: verlierer.id, sit: "besiegt" }], `${verlierer.fig.name}<br>ist besiegt!`, verlierer.fig.farbe, 3000)
    .then(() => (document.getElementById("sieg").style.display = "flex")), 700);
  return true;
}

// ---------- Darstellung ----------
function zeichne() {
  const brett = document.getElementById("brett");
  brett.innerHTML = "";
  const s = spieler[dran], g = spieler[1 - dran];
  spieler.forEach((p, i) => { if (!versteckt(i)) p.zuletzt = { r: p.r, c: p.c }; });   // was der Gegner zuletzt gesehen hat
  const ziele = (!bewegt && !sperre && !nichtMeinZug()) ? erreichbar(s) : new Set();
  const betrachter = online ? ich : dran;                       // aus wessen Sicht das Brett gezeigt wird
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const f = document.createElement("div");
    const t = feldTyp(r, c);
    const gl = GELAENDE[t];
    f.className = "feld" + ((r + c) % 2 ? " dunkel" : "") + (gl.klasse ? " " + gl.klasse : "");
    f.title = gl.name + " – " + gl.info;
    if (gl.bild) f.innerHTML = `<div class="boden-${gl.form}" style="background-image:url(bilder/${gl.bild}.jpg)"></div>`;
    if (kugeln.some(([a, b]) => a === r && b === c)) f.insertAdjacentHTML("beforeend", '<div class="kugel">⚡</div>');
    if (ziele.has(r + "," + c)) f.classList.add("ziel");
    if (r === g.r && c === g.c && kannAngreifen() && !sperre && !nichtMeinZug()) f.classList.add("angreifbar");
    spieler.forEach((p, i) => {
      if (p.r !== r || p.c !== c) return;
      if (i !== betrachter && versteckt(i)) return;            // der Gegner sieht ihn nicht
      const fig = document.createElement("div");
      fig.className = `figur p${i}` + (i === dran && !sperre ? " aktiv" : "") + (i === wackelt ? " getroffen" : "") + (imBusch(p) ? " imBusch" : "");
      fig.id = "fig" + i;
      fig.setAttribute("style", portraitStil(p.id, p.fig.level));
      fig.innerHTML = ersatz(p.id) + marken(p);
      f.appendChild(fig);
    });
    f.onclick = () => meinZug("feld", r, c);
    brett.appendChild(f);
  }
  spieler.forEach((p, i) => {
    const b = document.getElementById("box" + i);
    b.className = "spielerbox" + (i === dran ? " dran" : "");
    b.style.setProperty("--el", p.fig.farbe);
    const zust = [p.ladung ? "⚡ " + p.fig.spezial.name + " bereit" : "", p.gift ? "☠️ vergiftet" : "", p.frost ? "❄️ eingefroren" : ""].filter(Boolean).join(" · ");
    b.innerHTML = `<div class="zeile"><div class="mini" style="${portraitStil(p.id, p.fig.level)};box-shadow:0 0 0 3px ${SPIELERFARBE[i]}">${ersatz(p.id)}</div>
      <div style="flex:1"><div class="name">${p.fig.name}</div>
      <div class="status"><b style="color:${SPIELERFARBE[i]}">${nameVon(i)}</b>${computer && i === 1 ? "" : ` · 💰 ${geld[i]} €`} · ${p.fig.element} · ❤️ ${p.leben}/${p.max}${zust ? " · " + zust : ""}${computer && i === 1 ? ` · ${STUFEN[stufe].name}` : ""}</div>
      <div class="balken"><div style="width:${100 * p.leben / p.max}%"></div></div></div></div>`;
  });
  const z = document.getElementById("zuganzeige");
  z.textContent = `${nameVon(dran)}: ${s.fig.name}`;
  z.style.background = SPIELERFARBE[dran];
  const teile = [];
  if (!bewegt) teile.push(`👣 Tippe ein leuchtendes Feld, um zu laufen (${schritteVon(s)} Schritte)`);
  if (kannAngreifen()) teile.push(`⚔️ Tippe den rot leuchtenden Gegner für ${s.fig.angriffName}`);
  else if (!angegriffen && versteckt(1 - dran)) teile.push(`🌿 ${g.fig.name} hat sich im Busch versteckt!`);
  else if (!angegriffen) teile.push(`🎯 Gegner zu weit weg (Reichweite ${reichweiteVon(s)})`);
  if (s.ladung && !angegriffen) teile.push(kannSpezial() ? `⚡ ${s.fig.spezial.name} ist bereit!` : `⚡ ${s.fig.spezial.name}: Gegner zu weit (Reichweite ${s.fig.spezial.reichweite})`);
  const sk = document.getElementById("spezialKnopf");
  sk.className = "knopf spezial" + (s.ladung ? " an" : "");
  sk.textContent = "⚡ " + s.fig.spezial.name;
  sk.disabled = !kannSpezial() || sperre || nichtMeinZug();
  document.getElementById("zugEnde").disabled = nichtMeinZug();
  document.getElementById("hinweis").textContent = kiDran() ? `🤖 Der Computer überlegt …`
    : fernDran() ? `🌍 Dein Gegner ist dran …`
    : teile.join(" · ") || "Zug ist gleich vorbei …";
}

// ---------- Computer-Gegner ----------
// Einfach, aber nicht dumm: Spezial vor Angriff, sonst ein Feld suchen, von dem aus er treffen kann,
// Blitzkugeln und Lebensquelle mitnehmen, Lava meiden; nach dem Angriff aus der Reichweite des Gegners gehen.
const warte = ms => new Promise(f => setTimeout(f, ms));
async function bisFrei() { while (sperre) await warte(100); }
let kiLaeuft = false;
async function kiZug() {
  if (kiLaeuft) return;
  kiLaeuft = true;
  try {
    await warte(900);
    await kiAngriff();
    if (!kiDran() || vorbei) return;
    for (let versuch = 0; versuch < 2 && !bewegt; versuch++) {   // zweiter Versuch, falls er gegen einen Busch-Versteck lief
      const ziel = kiZiel();
      if (!ziel) break;
      klickFeld(ziel[0], ziel[1], true);
      await warte(700);
      await bisFrei();
      if (!kiDran() || vorbei) return;
    }
    await kiAngriff();
    if (!kiDran() || vorbei) return;
    await warte(500);
    await bisFrei();
    if (kiDran() && !vorbei) zugEnde();
  } finally {
    kiLaeuft = false;
  }
}
async function kiAngriff() {
  if (Math.random() > STUFEN[stufe].angriffQuote) return;   // Leicht: lässt manchmal eine Chance aus
  if (kannSpezial()) spezialAngriff();
  else if (kannAngreifen()) angriff();
  else return;
  await warte(300);
  await bisFrei();
  await warte(400);
}
function kiZiel() {
  const s = spieler[1], g = versteckt(0) ? { ...spieler[0], ...spieler[0].zuletzt } : spieler[0];  // versteckt: dort suchen, wo er zuletzt war
  const wert = (r, c) => {
    const p = { ...s, r, c }, t = feldTyp(r, c), d = kampfAbstand(p, g);
    const verletzt = s.leben < s.max;
    let w = angegriffen ? 0 : -d;                                 // vor dem Angriff: ran an den Gegner
    if (!angegriffen && d <= reichweiteVon(p)) w += 10;
    if (!angegriffen && s.ladung && d <= s.fig.spezial.reichweite) w += 12;
    if (angegriffen && d > reichweiteVon(g)) w += 6;              // nach dem Angriff ausweichen
    if (!s.ladung && kugeln.some(([a, b]) => a === r && b === c)) w += 8;
    if (t === "Q" && verletzt) w += 5;
    if (t === "L") w += istEl(s, "Feuer") ? (verletzt ? 2 : 0) : -6;
    if (t === "E" && !istEl(s, "Eis")) w -= 2;
    if (t === "B") w += (d <= reichweiteVon(g) ? 1.5 : 0) + (istEl(s, "Dschungel") && verletzt ? 2 : 0);
    return w + Math.random() * STUFEN[stufe].zufall;
  };
  let best = null, bestW = wert(s.r, s.c);
  for (const k of erreichbar(s)) {
    const [r, c] = k.split(",").map(Number);
    const w = wert(r, c);
    if (w > bestW) { best = [r, c]; bestW = w; }
  }
  return best;
}

function gleite(i, vr, vc) {
  const el = document.getElementById("fig" + i), p = spieler[i];
  if (!el) return;
  const zelle = document.getElementById("brett").clientWidth / N;
  const aktiv = el.classList.contains("aktiv");
  el.classList.remove("aktiv");
  el.style.transition = "none";
  el.style.transform = `translate(${(vc - p.c) * zelle}px, ${(vr - p.r) * zelle}px)`;
  el.getBoundingClientRect();
  el.style.transition = "transform .3s ease-out";
  el.style.transform = "";
  if (aktiv) setTimeout(() => el.classList.add("aktiv"), 320);
}

function legende() {
  const da = new Set(KARTE.join(""));
  document.getElementById("legende").innerHTML = Object.entries(GELAENDE).filter(([k, g]) => g.bild && da.has(k)).map(([k, g]) =>
    `<div class="gl-zeile"><span class="gl-bild" style="background-image:url(bilder/${g.bild}.jpg)"></span><span><b>${g.name}:</b> ${g.info}</span></div>`
  ).join("") + `<div class="gl-zeile"><span class="gl-bild kugel" style="position:static;width:30px;height:30px;animation:none">⚡</span><span><b>Blitzkugel:</b> Bleib darauf stehen, um sie einzusammeln – dann ist dein Spezialangriff bereit. Er trifft immer.</span></div>`
    + `<div class="gl-zeile">🎲 <span><b>Würfel:</b> 1 daneben · 2–5 Treffer · 6 Volltreffer (doppelt)</span></div>`;
}

function ambiente() {
  const a = document.getElementById("ambiente");
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("i");
    p.style.cssText = `left:${Math.random() * 100}%;top:${30 + Math.random() * 70}%;--d:${5 + Math.random() * 6}s;--v:${-Math.random() * 10}s;--x:${(Math.random() - .5) * 80}px`;
    a.appendChild(p);
  }
}

function marken(p) {
  return (p.gift ? '<span class="marke">☠️</span>' : "") + (p.frost ? '<span class="marke" style="right:auto;left:-4%">❄️</span>' : "");
}

function zahl(p, text, treffer, miss, extra) {
  const i = spieler.indexOf(p);
  if (online && i >= 0 && i !== ich && versteckt(i)) return;             // würde das Versteck verraten
  if (treffer) {
    wackelt = spieler.indexOf(p);
    document.getElementById("fig" + wackelt)?.classList.add("getroffen");
    setTimeout(() => (wackelt = -1), 400);
  }
  const z = document.createElement("div");
  z.className = "zahl" + (miss ? " miss" : "") + (extra ? " " + extra : "");
  z.textContent = text;
  z.style.left = (p.c + .5) / N * 100 + "%";
  z.style.top = (p.r + .5) / N * 100 + "%";
  document.getElementById("effekte").appendChild(z);
  setTimeout(() => z.remove(), 1100);

// Sie halten sich ans Gelände wie im Kampf, laufen nicht auf Portal, Truhen, andere Monster oder die eigene Figur.
// Der Endgegner bleibt in seinem Burgfried stehen.
function soloMonsterZiehen() {
  const besetzt = new Set(solo.wilde.filter(w => !solo.besiegt.has(soloSchluessel(w))).map(w => w.r + "," + w.c));
  for (const w of solo.wilde) {
    if (w.boss || solo.besiegt.has(soloSchluessel(w)) || Math.random() < 0.5) continue;
    const [dr, dc] = [[-1, 0], [1, 0], [0, -1], [0, 1]][Math.floor(Math.random() * 4)];
    const r = w.r + dr, c = w.c + dc, f = FIGUREN[w.id];
    if (!soloImFeld(r, c) || besetzt.has(r + "," + c) || (r === solo.r && c === solo.c) || soloTruhe(r, c)) continue;
    const t = solo.welt[r][c];
    if (t === "M" || t === "P" || !f.fliegt && (t === "S" || (t === "F" && f.element !== "Stein"))) continue;
    besetzt.delete(w.r + "," + w.c); besetzt.add(r + "," + c);
    w.r = r; w.c = c;
  }
}
// Kampf gegen ein wildes Monster: ganz normaler Kampf gegen den Computer; danach geht es zurück in die Solo-Welt
function soloKaempfe(w) {
  solo.schutz = SOLO_SCHONZEIT;
  soloSpeichern();
  try { sessionStorage.setItem(SOLO_KAMPF_KEY, "1"); } catch (e) { /* ohne Speicher weiter */ }
  soloKampf = w;
  if (solo.ort === "dschungel") karteWahl = "dornendschungel";   // nur für diesen Kampf, gespeichert bleibt die Wahl der Startseite
  const meins = solo.id;
  solo = null;
  document.getElementById("solo").style.display = "none";
  computer = true; soloModus = false;              // nur für diesen Kampf; gespeichert bleibt Solo
  document.getElementById("nochmal").textContent = "🧭 Weiter erkunden";
  wahl.length = 0;
  wahl.push(meins, w.id);
  starte();
}
// Ende eines Solo-Kampfs (aus dem Sieg-Bildschirm): Sieg = das wilde Monster ist weg
function soloKampfEnde(gewinner) {
  if (!soloKampf || gewinner !== 0 || sitz[0] === null) return;
  const st = spielstaende[sitz[0]].solo;
  st.besiegt = [...new Set([...(st.besiegt || []), soloSchluessel(soloKampf)])];
  speichereSpielstaende();
}
// Nach dem Neuladen (Weiter erkunden / Zurück im Kampf) direkt wieder in die Solo-Welt
function soloFortsetzen() {
  let weiter = false;
  try { weiter = sessionStorage.getItem(SOLO_KAMPF_KEY) === "1"; sessionStorage.removeItem(SOLO_KAMPF_KEY); } catch (e) { /* ohne Speicher weiter */ }
  const id = sitz[0] !== null && spielstaende[sitz[0]].solo?.id;
  if (!weiter || !soloModus || !id || !FIGUREN[id] || !besitzt(0, id)) return;
  wahl.push(id);
  starteSolo(id, true);
}
document.addEventListener("keydown", e => {
  if (!solo) return;
  const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1], w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1] }[e.key];
  if (!d) return;
  e.preventDefault();
  if (!soloSchritt(...d)) ton("daneben");
});

// „Kampf, los!“ beim Kampfbeginn: aufgenommene Stimme toene/kampf_go.mp3, wenn es sie gibt, sonst die Stimme des Browsers
function kampfAnsage() {
  const sprich = () => {
    try {
      // Männliche deutsche Stimme: Edge hat Conrad/Killian/Florian, Windows Stefan; sonst irgendeine deutsche, tief gestellt
      const de = speechSynthesis.getVoices().filter(v => v.lang.startsWith("de"));
      const stimme = ["Conrad", "Killian", "Florian", "Stefan"].map(n => de.find(v => v.name.includes(n))).find(Boolean) || de[0];
      // „Kampf, los!“ schnell und tief (Wahl des Sohns aus entwuerfe/kampf-go.html; „Go“ las die Stimme als „G-oh“/„Gojo“)
      const s = new SpeechSynthesisUtterance("Kampf, los!");
      s.lang = "de-DE"; s.rate = 1.4; s.pitch = 0.6; s.volume = 1;
      if (stimme) s.voice = stimme;
      speechSynthesis.speak(s);
    } catch (e) { /* ohne Ansage weiter */ }
  };
  const a = new Audio("toene/kampf_go.mp3");
  a.onerror = sprich;
  a.play().catch(() => {});
}

// Zum Testen (kein Knopf): index.html?neu startet ganz von vorne
if (new URLSearchParams(location.search).has("neu")) {
  try { [GELD_KEY, GEKAUFT_KEY, WELT_KEY, POKAL_KEY, LEVEL_KEY, SPIELSTAND_KEY, SITZ_KEY].forEach(k => localStorage.removeItem(k)); } catch (e) { /* ohne Speicher weiter */ }
  location.replace(location.pathname);
}
try { speechSynthesis.getVoices(); } catch (e) { /* ohne Ansage weiter */ }   // Stimmenliste lädt im Browser verzögert, früh anstoßen
ladeSpielstaende();
ladeSitze();
zeigeGeldbeutel();
zeigeAuswahl();
soloFortsetzen();
</script>
