<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tower – Prototyp</title>
<style>
  :root {
    --bg: #11151c; --panel: #1b212b; --panel2: #252d3a; --text: #e8edf4; --muted: #95a1b2;
    --accent: #ffd23f; --good: #4f8cff; --ok: #ffc94d; --bad: #ff4d5e; --line: #2f3846;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07090d; color: var(--text);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  #app { position: relative; max-width: 440px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column;
    background: var(--bg); border-left: 1px solid var(--line); border-right: 1px solid var(--line); user-select: none; }
  /* wide mode (PC test only): the stage takes the whole window, header, hint, menus and panel stay phone-sized */
  body.wide #app { max-width: none; border: 0; }
  body.wide header, body.wide #hint, body.wide #tools { width: 100%; max-width: 440px; margin: 0 auto; }
  body.wide #subtools, body.wide #panel { left: 50%; right: auto; width: calc(100% - 16px); max-width: 424px; transform: translateX(-50%); }
  header { padding: 6px 10px 4px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row { margin-top: 4px; }
  #clock { font-weight: 600; min-width: 92px; white-space: nowrap; }
  #money { font-weight: 700; color: var(--accent); flex: 1; text-align: center; font-variant-numeric: tabular-nums; cursor: pointer; }
  #money .loan { font-weight: 400; font-size: 11px; color: var(--muted); }
  #money.neg { color: var(--bad); }
  #stars { font-size: 16px; letter-spacing: 1px; color: var(--accent); cursor: pointer; }
  /* star overlay and diary (TOWER-a0010 P2) */
  .crit { display: grid; grid-template-columns: 1.4em 1fr auto; gap: 2px 8px; margin: 6px 0; }
  .crit .ok { color: var(--good); } .crit .no { color: var(--bad); }
  .crit .lb { color: var(--text); } .crit .vl { color: var(--muted); font-variant-numeric: tabular-nums; }
  #panel details { border-top: 1px solid var(--line); padding: 4px 0; }
  #panel details summary { cursor: pointer; color: var(--text); }
  #panel details ul { margin: 4px 0 2px; padding-left: 18px; color: var(--muted); }
  .diary div { padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  #stats { flex: 1; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats .pop { filter: brightness(0) invert(0.85); }   /* 👥 is a dark silhouette, invisible on the dark header */
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button, .iconbtn { background: var(--panel2); color: var(--text); border: 0; padding: 4px 9px; font-size: 13px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #111; font-weight: 700; }
  .iconbtn { border-radius: 8px; border: 1px solid var(--line); }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #toast { position: absolute; left: 8px; right: 8px; top: 8px; pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
  .msg { background: rgba(17,21,28,.88); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12.5px;
    transition: opacity .5s; }
  .msg.bad { border-color: var(--bad); } .msg.good { border-color: #3fbf7f; } .msg.star { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  /* fixed two lines (PO 30.10.2026): a hint that wrapped to a second line shrank the stage and shook the map;
     longer ones are cut, the details are in ❓ Hilfe */
  #hint { height: 41px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 16px; padding: 8px 10px 0; font-size: 12.5px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }
  #hint.err { color: var(--bad); }
  #hint.go { color: #7ee0a8; }
  nav { display: flex; gap: 4px; padding: 6px; overflow-x: auto; background: var(--panel); scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  /* second level floats over the game, right above the hint bar, instead of pushing the layout */
  #subtools { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 3; justify-content: center;
    background: rgba(21,26,34,.92); border: 1px solid var(--line); border-radius: 12px; padding: 5px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  #subtools[hidden] { display: none; }
  #subtools { flex-wrap: wrap; }
  #subtools .tool { flex: 1 1 0; max-width: 96px; }
  .tool.lock { opacity: .45; }
  .tool.lock .ct { color: var(--ok); }
  #tools .tool { flex: 1 1 0; }
  .tool.group.on { border-color: var(--accent); background: #2c2818; }
  .tool { flex: 0 0 auto; min-width: 58px; padding: 5px 4px 4px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); cursor: pointer; text-align: center; }
  .tool .ic { font-size: 19px; display: block; line-height: 1.1; }
  .tool .lb { font-size: 10.5px; display: block; }
  .tool .ct { font-size: 9.5px; color: var(--muted); display: block; }
  .tool.on { border-color: var(--accent); background: #3a3420; }
  .tool.toggle.on { border-color: #4f8cff; background: #1f2d4a; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; max-height: 75%; overflow-y: auto; background: var(--panel);
    border-top: 2px solid var(--accent); border-radius: 14px 14px 0 0; padding: 12px 14px 14px; box-shadow: 0 -6px 24px rgba(0,0,0,.5); }
  #panel[hidden] { display: none; }
  #panel h3 { margin: 0 0 6px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  #panel .close { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  #panel p { margin: 4px 0; color: var(--muted); }
  #panel b { color: var(--text); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 6px 0; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { min-width: 40px; padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2);
    color: var(--muted); font-size: 12px; cursor: pointer; text-align: center; }
  .chip.on { background: #2b4a2f; border-color: #3fbf7f; color: #d8ffe6; }
  .chip.dis { opacity: .35; cursor: default; }
  .btnrow { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 13px; }
  .btn.warn { border-color: var(--bad); color: #ffb3ba; }
  .btn.dis { opacity: .35; cursor: default; }
  .btn.on { border-color: #4f8cff; background: #1f2d4a; }
  .st-good { color: var(--good); } .st-ok { color: var(--ok); } .st-bad { color: var(--bad); }
  .bar { display: inline-block; width: 70px; height: 8px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line); vertical-align: middle; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); }
  .bar i.ok { background: var(--ok); } .bar i.bad { background: var(--bad); }
  .cars { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 8px; align-items: center; margin: 6px 0; font-size: 12.5px; }
  .needs { display: grid; grid-template-columns: auto 1fr auto auto; gap: 3px 10px; align-items: baseline; margin: 6px 0; font-size: 12.5px; }
  .needs .hd { color: var(--muted); font-size: 11px; }
  .warnbox { border: 1px solid var(--ok); border-radius: 8px; padding: 5px 8px; margin: 6px 0; color: #ffe08a; font-size: 12.5px; }
  .warnbox.red { border-color: var(--bad); color: #ffb4a8; }
  .fc { color: var(--muted); font-size: 12.5px; margin: 2px 0 4px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .pos { color: #7ee0a8; } .neg { color: var(--bad); }
  .log div { padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .help li { margin: 4px 0; overflow-wrap: anywhere; }
  .help li.hh { margin-top: 12px; font-weight: bold; border-bottom: 1px solid #8884; list-style: none; }
  /* save slots (menu panel and start screen) */
  .slots { display: flex; flex-direction: column; gap: 5px; margin: 6px 0; }
  .slot { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel2); cursor: pointer; text-align: left; color: var(--text); font: inherit; width: 100%; }
  .slot.on { border-color: var(--accent); background: #2c2818; }
  .slot.empty { color: var(--muted); }
  .slot .nr { color: var(--muted); font-size: 12px; min-width: 16px; }
  .slot .nm { flex: 1; min-width: 0; }
  .slot .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .nm small { color: var(--muted); font-size: 11.5px; }
  .slot .del { color: var(--muted); font-size: 15px; cursor: pointer; padding: 2px 4px; }
  .slot .del.armed { color: var(--bad); font-size: 12px; }
  .nameIn { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  /* start screen: over the whole app, the tower of the last game in the background */
  #start { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 20px 18px; background: rgba(9,12,17,.86); backdrop-filter: blur(3px); }
  #start[hidden] { display: none; }
  #start .box { width: 100%; max-width: 340px; }
  #start h1 { margin: 0 0 2px; font-size: 34px; letter-spacing: 2px; text-align: center; color: var(--accent); }
  #start .sub { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 13px; }
  #start .big { display: block; width: 100%; margin: 8px 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); font: inherit; font-size: 16px; font-weight: 600; text-align: left; cursor: pointer; }
  #start .big small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
  #start .big.main { border-color: var(--accent); background: #2c2818; }
  #start .big.dis { opacity: .4; cursor: default; }
  #start .big.armed { border-color: var(--bad); }
  #start .back { margin-top: 10px; }
  #start .nameIn { width: 100%; flex: none; font-size: 17px; padding: 10px 12px; margin: 4px 0 10px; }
  #start label { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <span id="clock">Mo · Tag 1 · Frühling · 06:00</span>
      <span id="money">0 €</span>
      <span id="stars" title="Sterne: Was fehlt für den nächsten?">☆☆☆</span>
    </div>
    <div class="row">
      <span id="stats" title="👥 Bewohner und Büroleute · 🚶 Besucher von außen, gerade im Turm · 😊 Zufriedenheit"></span>
      <div class="seg" id="speed">
        <button data-sp="pause" title="Pause">⏸</button>
        <button data-sp="slower" title="Langsamer">‹</button>
        <button data-sp="run" id="speedVal" class="on" title="Weiter">1×</button>
        <button data-sp="faster" title="Schneller">›</button>
      </div>
      <button class="iconbtn" id="menuBtn" title="Menü">☰</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <nav id="subtools" hidden></nav>
    <div id="panel" hidden></div>
  </div>
  <div id="hint"></div>
  <nav id="tools"></nav>
  <div id="start" hidden><div class="box"></div></div>
</div>
<script src="engine.js?v=928aa539f2"></script>
<script src="dev-saves.js?v=6856d324b1"></script>
<script src="sounds.js?v=80df8bb98d"></script>
<script src="audio.js?v=d27cf9dea8"></script>
<script src="styles/render.js?v=3b68970173"></script>
<script src="styles/pixel.js?v=ead63f98a8"></script>
<script>
'use strict';
const { CFG, Game, floorName, fmtTime } = window.TowerEngine;
const SAVE_KEY = 'tower-game-save-v1';
const BASE_RATE = 60;            // game seconds per real second at 1× (PO 30.10.2026: 120 → 60, people and cars looked rushed)
const FH = 1.6;                  // floor height in tiles
const MARGIN_L = 1.7, MARGIN_R = 0.5;
const SCROLL_BELOW = 240;        // screen px the view may scroll below the ground (menus float over the stage)
// E40/E69: drawn world width – tower A alone (CFG.TW), the whole width (CFG.W) once tower B may be built or stands
const W = () => game ? game.worldW : CFG.TW;

// ---------- state ----------
let curSlot = null;              // save slot the running game came from or was last saved to (preselected in „Speichern“)
let curName = '';                // the tower's name: given at „Neues Spiel“, default name when saving
let game = loadGame();
let speed = 1;
let tool = 'inspect';
let heat = null;                 // heatmap: null = off, 'time' Wegzeit, 'energy' Energie, 'money' Geld, 'needs' Bedürfnisse, 'noise' Lärm
let selInfo = null;              // selected office/flat: provider shares and penalty sources (refreshed with the panel, not per frame)
let ghost = null;                // {kind:'room'|'shaft'|'demolish', ...}
let anchor = null;               // first tap for shafts
let selected = null;             // inspected room/shaft
let panelMode = null;            // 'obj' | 'menu' | 'log' | 'help' | 'money' | 'stars' | 'diary'

function loadGame() {
  const saved = readAutosave();
  if (saved && saved.slot != null) curSlot = saved.slot;
  if (saved && saved.name) curName = saved.name;
  const g = new Game(saved);
  hook(g);
  return g;
}
function hook(g) {
  g.onMessage = m => { toast(m.text, m.kind); if (m.kind === 'star' && openGroup) showGroup(openGroup); };   // unlocked chips
  g.onDayEnd = () => save(g);
  g.entranceX = CFG.ENTRANCE_X;   // world fields TowerRender expects (not saved); g.W is the engine's getter (worldW, E40)
  g.maxFloors = CFG.MAX_FLOOR; g.minFloors = CFG.MIN_FLOOR; g.floorName = floorName;   // drawn height and depth (TOWER-a0010 P1)
}
// autosave (= „Fortsetzen“): every morning and when the page is left (mid-day: the day restarts at 06:00)
function save(g, rewind) {
  const d = g.serialize(rewind); if (curSlot != null) d.slot = curSlot; if (curName) d.name = curName;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) { /* ignore */ }
}
function saveNow() { if (startEl.hidden || startFromMenu) save(game, true); }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
function readAutosave() {
  try { const s = localStorage.getItem(SAVE_KEY); const d = s && JSON.parse(s); return d && d.v === 1 ? d : null; } catch (e) { return null; }
}
const euro = n => Math.round(n).toLocaleString('de-DE') + ' €';
const kEuro = n => n >= 1e6 ? (n / 1e6).toLocaleString('de-DE') + ' Mio.' : n >= 1000 ? (n / 1000).toLocaleString('de-DE') + 'k' : String(n);

// ---------- tools ----------
// two levels: groups in the bottom row, a group's items in a second row above it
const roomItem = id => ({ id, ic: CFG.rooms[id].icon, lb: CFG.rooms[id].label, ct: kEuro(CFG.rooms[id].cost), star: CFG.rooms[id].star || 0 });
const GROUPS = [
  { id: 'inspect', ic: '🔍', lb: 'Ansehen' },
  { id: 'rooms', ic: '🏢', lb: 'Räume', items: [
    ...['office', 'condo', 'restaurant', 'skylobby', 'workshop', 'cafe', 'daycare', 'supermarket', 'gym', 'spa', 'rooftop', 'hotel', 'garage', 'lockers', 'tech', 'damper', 'cinema', 'pool', 'library', 'district', 'logistics', 'station', 'passage', 'clinic', 'school', 'townhall', 'heliport', 'checkpoint', 'gondola', 'server', 'storage', 'bridge', 'airship', 'geothermal', 'wind', 'skygarden', 'antenna', 'spacestation'].map(roomItem),
    { id: 'shell', ic: CFG.shell.icon, lb: CFG.shell.label, ct: kEuro(CFG.shell.cost) + '/Feld' },
  ] },
  { id: 'ways', ic: '🛗', lb: 'Wege', items: [
    { id: 'stairs', ic: '🪜', lb: 'Treppe', ct: kEuro(CFG.links.stairs.cost) },
    { id: 'escalator', ic: '↗️', lb: 'Rolltreppe', ct: kEuro(CFG.links.escalator.cost) },
    { id: 'normal', ic: '🛗', lb: 'Aufzug', ct: 'ab ' + kEuro(CFG.shafts.normal.base) },
    { id: 'express', ic: '⚡', lb: 'Express', ct: 'ab ' + kEuro(CFG.shafts.express.base), star: CFG.shafts.express.star || 0 },
    { id: 'double', ic: '🚡', lb: 'Doppeldecker', ct: 'ab ' + kEuro(CFG.shafts.double.base), star: CFG.shafts.double.star || 0 },
    { id: 'fire', ic: '🚒', lb: 'Feuerwehr', ct: 'ab ' + kEuro(CFG.shafts.fire.base), star: CFG.shafts.fire.star || 0 },
    { id: 'service', ic: '🧹', lb: 'Dienstaufzug', ct: 'ab ' + kEuro(CFG.shafts.service.base), star: CFG.shafts.service.star || 0 },
    { id: 'twin', ic: '⇅', lb: 'TWIN', ct: 'ab ' + kEuro(CFG.shafts.twin.base + CFG.shafts.twin.car), star: CFG.shafts.twin.star || 0 },
    { id: 'multi', ic: '🔁', lb: 'MULTI', ct: 'ab ' + kEuro(CFG.shafts.multi.base), star: CFG.shafts.multi.star || 0 },
    { id: 'maglev', ic: '🧲', lb: 'Maglev', ct: 'ab ' + kEuro(CFG.shafts.maglev.base), star: CFG.shafts.maglev.star || 0 },
  ] },
  { id: 'demolish', ic: '🧨', lb: 'Abriss' },
  // heatmaps: entries of their own group; tapping the active one again switches it off, the tool stays
  { id: 'heat', ic: '🌡️', lb: 'Heatmap', heat: true, items: [
    { id: 'heat:time', heat: 'time', ic: '⏱️', lb: 'Wegzeit' },
    { id: 'heat:energy', heat: 'energy', ic: '🔋', lb: 'Energie' },
    { id: 'heat:money', heat: 'money', ic: '💶', lb: 'Geld' },
    { id: 'heat:needs', heat: 'needs', ic: '🧺', lb: 'Bedürfnisse' },
    { id: 'heat:noise', heat: 'noise', ic: '🔊', lb: 'Lärm' },
  ] },
];
const HEAT_HINTS = {
  time: 'Heatmap Wegzeit: blau gut, gelb geht so, rot schlecht.',
  energy: 'Heatmap Energie (Ø Kraft bei Ankunft): blau frisch, gelb müde, rot erschöpft.',
  money: 'Heatmap Geld (Netto je Etage gestern: Miete + Umsatz − Betrieb − Wartung): rot Verlust, grau ±0, grün Gewinn.',
  needs: 'Heatmap Bedürfnisse (Erfüllung je Raum, leere nach Vorhersage): blau ab ' + Math.round(CFG.needHeat.good * 100) + ' %, gelb, rot ≤ ' + Math.round(CFG.warnBelow * 100) + ' % = Warnung.',
  noise: 'Heatmap Lärm (Strafe je Büro und Wohnung): blau ruhig, gelb etwas, rot ab ' + Math.round(CFG.noiseHeat.bad * 100) + ' % Abzug.',
};
const HINTS = {
  stairs: 'Treppe: verbindet die angetippte Etage mit der darüber. Langsam, unbequem und anstrengend (hoch ' + CFG.links.stairs.energyUp + ' Energie je Etage).',
  escalator: 'Rolltreppe: verbindet die angetippte Etage mit der darüber. Bequemer und schont die Kraft (' + CFG.links.escalator.energyUp + ' Energie je Etage).',
  inspect: '',   // PO 30.10.2026: no standing help text while looking around
  office: 'Büro: 6 Leute, 5.000 € Miete/Tag. Stelle antippen, nochmal tippen = bauen.',
  condo: 'Wohnung: 3 Leute, 3.000 € Miete/Tag. Stelle antippen, nochmal tippen = bauen.',
  restaurant: 'Restaurant: Gäste von außen + Mittagessen der Büros. Antippen, nochmal = bauen.',
  skylobby: 'Sky-Lobby (nur alle ' + CFG.SKY_EVERY + ' Etagen: ' + [1, 2, 3].map(i => i * CFG.SKY_EVERY + '.').join('/') + ' … OG): hier darf man umsteigen, Express hält hier.',
  damper: 'Schwingungsdämpfer: schützt bei Erdbeben die ' + CFG.rooms.damper.reach + ' Etagen darunter und seine eigene (' + euro(CFG.rooms.damper.upkeep) + '/Tag). Im Panel in drei Stufen aufwerten bis zur Isolierten Gründung. Ab ' + '★'.repeat(CFG.weather.storm.star) + ' schützt er auch bei Sturm: Luxus-Räume über dem ' + CFG.weather.storm.line + '. OG ohne Dämpfer verlieren dann ' + Math.round(CFG.weather.storm.drop * 100) + ' % Erfüllung. Antippen, nochmal = bauen.',
  tech: 'Technikebene: Lüftung, Pumpen, Strom für die Etagen darüber (' + euro(CFG.rooms.tech.upkeep) + '/Tag, laut). Über dem ' + CFG.techFloors.map(f => f + '.').join(' und ') + ' OG geht es erst weiter, wenn dort eine steht. Antippen, nochmal = bauen.',
  workshop: 'Werkstatt: 2 Handwerker warten die Aufzüge (' + euro(CFG.rooms.workshop.upkeep) + '/Tag), nah an den Schächten = kurze Wege. Laut. Antippen, nochmal = bauen.',

const toolsEl = document.getElementById('tools');
const subEl = document.getElementById('subtools');
let openGroup = null;
const lastInGroup = {};
const groupOf = id => GROUPS.find(g => g.id === id || (g.items && g.items.some(i => i.id === id)));
// t.star: locked until that star (chip greyed with "ab ★")
function toolButton(t) {
  const b = document.createElement('button');
  const locked = t.star > game.stars;
  b.className = 'tool' + (t.heat ? ' toggle' : '') + (t.items ? ' group' : '') + (locked ? ' lock' : '');
  b.dataset.id = t.id;
  const ct = locked ? 'ab ' + '★'.repeat(t.star) : t.ct;
  b.innerHTML = `<span class="ic">${t.ic}</span><span class="lb">${t.lb}${t.items ? ' ▴' : ''}</span>` + (ct ? `<span class="ct">${ct}</span>` : '');
  return b;
}
for (const g of GROUPS) {
  const b = toolButton(g);
  b.onclick = () => {
    if (!g.items) { showGroup(null); setTool(g.id); return; }
    if (openGroup === g) { showGroup(null); return; }      // second tap folds the row, tool stays
    showGroup(g);
    if (!g.heat) setTool(lastInGroup[g.id] || g.items[0].id);
  };
  toolsEl.appendChild(b);
}
// heatmap entry: on, or off when it is already on (the build tool is not touched)
function setHeat(h) {
  heat = heat === h ? null : h;
  const b = toolsEl.querySelector('[data-id="heat"]');
  const it = heat && GROUPS.find(g => g.heat).items.find(i => i.heat === heat);
  b.classList.toggle('on', heat != null);
  b.querySelector('.lb').textContent = it ? it.lb + ' ▴' : 'Heatmap ▴';
  setHint(heat ? HEAT_HINTS[heat] + ' Nochmal tippen = aus.' : HINTS[tool] || '');
  markTools();
}
function showGroup(g) {
  openGroup = g;
  subEl.innerHTML = '';
  subEl.hidden = !g;
  if (!g) return;
  for (const it of g.items) {
    const b = toolButton(it);
    b.onclick = () => {
      if (it.heat) { setHeat(it.heat); return; }
      if (it.star > game.stars) { setHint(it.lb + ': erst ab ' + '★'.repeat(it.star) + ' – ' + (HINTS[it.id] || ''), 'err'); return; }
      setTool(it.id);
    };
    subEl.appendChild(b);
  }
  markTools();
}
function markTools() {
  const g = groupOf(tool);
  for (const b of toolsEl.children) if (b.dataset.id !== 'heat') b.classList.toggle('on', g && b.dataset.id === g.id);
  for (const b of subEl.children) b.classList.toggle('on', b.dataset.id === tool || b.dataset.id === 'heat:' + heat);
}
function setTool(id) {
  tool = id; ghost = null; anchor = null;
  const g = groupOf(id);
  if (g && g.items) lastInGroup[g.id] = id;
  markTools();
  setHint(HINTS[id] || '');
  if (id !== 'inspect') closePanel();
}
const hintEl = document.getElementById('hint');
function setHint(text, cls) { hintEl.textContent = text; hintEl.className = cls || ''; }

// ---------- header ----------
// speed: ⏸ pauses, ‹ › step through SPEEDS, the value button resumes
const SPEEDS = [1, 3, 10, 20];
let speedIdx = 0, paused = false;
const speedEl = document.getElementById('speed');
const speedValEl = document.getElementById('speedVal');
function applySpeed() {
  speed = paused ? 0 : SPEEDS[speedIdx];
  speedValEl.textContent = SPEEDS[speedIdx] + '×';
  speedValEl.classList.toggle('on', !paused);
  speedEl.querySelector('[data-sp="pause"]').classList.toggle('on', paused);
}
function togglePause() { paused = !paused; applySpeed(); }
speedEl.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.sp;
  if (a === 'pause') paused = true;
  else if (a === 'run') paused = false;
  else if (a === 'slower') { speedIdx = Math.max(0, speedIdx - 1); paused = false; }
  else if (a === 'faster') { speedIdx = Math.min(SPEEDS.length - 1, speedIdx + 1); paused = false; }
  applySpeed();
};
document.getElementById('menuBtn').onclick = () => openMenu();
document.getElementById('money').onclick = () => openMoney();
document.getElementById('stars').onclick = () => { if (panelMode === 'stars') closePanel(); else openStars(); };

// wide mode: PC-only test option, stage fills the window, menus stay phone-sized
const WIDE_KEY = 'tower-game-wide-v1';
let wide = false;
try { wide = localStorage.getItem(WIDE_KEY) === '1'; } catch (e) { wide = false; }
function setWide(on) {
  wide = !!on;
  document.body.classList.toggle('wide', wide);
  try { localStorage.setItem(WIDE_KEY, wide ? '1' : '0'); } catch (e) { /* ignore */ }
  resize(); resetView();
}
document.body.classList.toggle('wide', wide);

const SEASONS = [['🌷', 'Der Frühling', 'Frühling'], ['☀️', 'Der Sommer', 'Sommer'], ['🍂', 'Der Herbst', 'Herbst'], ['❄️', 'Der Winter', 'Winter']];
let lastSeason = null;
function updateHeader() {
  document.getElementById('clock').textContent = game.weekdayName + ' · Tag ' + game.day + ' · ' + SEASONS[game.season][2] + ' · ' + fmtTime(game.t);
  if (lastSeason !== game.season) {
    if (lastSeason != null) toast(SEASONS[game.season][0] + ' ' + SEASONS[game.season][1] + ' beginnt', 'good');
    lastSeason = game.season;
  }
  const m = document.getElementById('money');
  const mt = euro(game.money) + (game.loan > 0 ? ' <span class="loan">· Kredit ' + kEuro(game.loan) + '</span>' : '');
  if (m.innerHTML !== mt) m.innerHTML = mt;
  m.classList.toggle('neg', game.money < 0);
  document.getElementById('stars').textContent = '★'.repeat(game.stars) + '☆'.repeat(CFG.stars.length - 1 - game.stars);
  const req = game.nextStarReq();
  const pop = '<span class="pop">👥</span>';
  let s = pop + ' ' + game.population + ' · 🚶 ' + game.visitorsInside + ' · 😊 ' + Math.round(game.sat * 100) + ' %';
  if (req) s += ' · nächster ★: ' + req.pop.toLocaleString('de-DE') + ' ' + pop + ', ' + Math.round(req.sat * 100) + ' %' + (req.restaurants ? ', 🍽️' : '') + (req.upgraded ? ', ' + game.upgradedRooms() + '/' + req.upgraded + ' ▲' : '');
  else {   // P9 (E55): after the last star the goal – the space elevator
    const gi = game.goalInfo();
    s += ' · ★★★★★ – ' + (gi.launched != null ? '🚀 die erste Kabine ist gestartet' : gi.done != null ? '🎯 Ziel erreicht – Start um ' + fmtTime(CFG.goal.launchAt) + ' Uhr' : gi.platform ? '🚀 ' + gi.streak + ' / ' + gi.days + ' Tage ' + Math.round(gi.sat * 100) + ' %' : 'ganz oben wartet der Weltraumfahrstuhl');
  }
  const st = document.getElementById('stats');
  if (st.innerHTML !== s) st.innerHTML = s;
}

// ---------- toast ----------
const toastEl = document.getElementById('toast');
function toast(text, kind) {
  const d = document.createElement('div');
  d.className = 'msg ' + (kind || '');
  d.textContent = text;
  toastEl.appendChild(d);
  while (toastEl.children.length > 3) toastEl.removeChild(toastEl.firstChild);
  setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 600); }, kind === 'star' ? 6000 : 3500);
}

// ---------- panel ----------
const panelEl = document.getElementById('panel');
let mergePrev = null;   // P6: { room, dir } after the first tap on „⇔ mit links/rechts“ (preview); the second tap merges
function closePanel() { panelEl.hidden = true; panelMode = null; selected = null; selInfo = null; mergePrev = null; }
function openPanel(html, mode) { panelEl.innerHTML = html; panelEl.hidden = false; panelMode = mode; panelEl.dataset.key = ''; }
panelEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'close') { closePanel(); return; }
  if (act === 'priv') {   // TOWER-a0011 E21: private stop on/off
    if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; }
    const r = game.togglePriv(selected, +b.dataset.f);
    if (!r.ok) setHint(r.reason, 'err'); else setHint(r.on ? `⭐ Privathalt ${floorName(r.f)} (−${euro(r.cost)}): der Express hält jetzt auch dort` : '⭐ Privathalt aufgehoben', 'go');
    renderObjPanel(); return;
  }
  if (act === 'dispatch') {   // TOWER-a0011 E12: destination dispatch on/off
    if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; }
    const r = game.toggleDispatch(selected);
    if (!r.ok) setHint(r.reason, 'err'); else setHint(selected.dd ? `🎯 Zielwahl an (−${euro(r.cost)}): die Kabinen teilen die Ziele unter sich auf` : '🎯 Zielwahl aus', 'go');
    renderObjPanel(); return;
  }
  if (act === 'split') { if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; } const r = game.moveSplit(selected, +b.dataset.dir); setHint(r.ok ? 'Teilung jetzt im ' + floorName(r.f) : r.reason, r.ok ? 'go' : 'err'); renderObjPanel(); return; }   // TOWER-a0011 E25: TWIN split
  if (act === 'addcar') { const r = game.addCar(selected); if (!r.ok) setHint(r.reason, 'err'); renderObjPanel(); return; }
  if (act === 'delcar') { const r = game.removeCar(selected); if (!r.ok) setHint(r.reason, 'err'); renderObjPanel(); return; }
  if (act === 'extend') { if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; } const r = game.extendShaft(selected, +b.dataset.dir); if (!r.ok) setHint(r.reason, 'err'); renderObjPanel(); return; }
  if (act === 'wide') { setWide(!wide); openMenu(); return; }
  if (act === 'stop') { if (b.classList.contains('dis')) return; game.toggleStop(selected, +b.dataset.f); renderObjPanel(); return; }
  if (act === 'emergency') {
    if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; }
    const r = game.callEmergency(selected.cars[+b.dataset.car]);
    if (!r.ok) setHint(r.reason, 'err');
    renderObjPanel(); return;
  }
  if (act === 'upg') {   // P3 (E19): plant-floor upgrade backup power / leak warning
    if (b.classList.contains('dis') || b.classList.contains('on')) { setHint(b.title, b.classList.contains('on') ? 'go' : 'err'); return; }
    const r = game.buyUpg(selected, b.dataset.key);
    setHint(r.ok ? CFG.incidents.upg[r.key].label + ' eingebaut (−' + euro(r.cost) + ')' : r.reason, r.ok ? 'go' : 'err');
    renderObjPanel(); return;
  }
  if (act === 'platform') {   // P9 (E55): the space station's platform – the goal
    if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; }
    const r = game.buildPlatform(selected);
    setHint(r.ok ? '🚀 Plattform gebaut (−' + euro(r.cost) + ')' : r.reason, r.ok ? 'go' : 'err');
    renderObjPanel(); return;
  }
  if (act === 'damperUp' || act === 'repair') {
    if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; }
    const r = act === 'repair' ? game.repairRoom(selected) : game.upgradeDamper(selected);
    setHint(r.ok ? (act === 'repair' ? (r.emergency ? 'Notdienst kommt' : 'Bezahlt – ein Handwerker kommt') : 'Aufgewertet') + ' (−' + euro(r.cost) + ')' : r.reason, r.ok ? 'go' : 'err');
    renderObjPanel(); return;
  }
  if (act === 'merge') {   // P6 (E12/E34): first tap = preview, second tap on the same button = merge
    if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; }
    const dir = b.dataset.dir === 'up' || b.dataset.dir === 'whole' ? b.dataset.dir : +b.dataset.dir;   // E37: „⇕ mit oben“ = the block of four, E51 „⇔ ganze Etage“
    if (mergePrev && mergePrev.room === selected && mergePrev.dir === dir) {
      const r = dir === 'up' ? game.mergeUp(selected) : dir === 'whole' ? game.mergeWhole(selected) : game.merge(selected, dir);
      mergePrev = null;
      setHint(r.ok ? 'Zusammengelegt: ' + r.label + ' (−' + euro(r.cost) + ')' : r.reason, r.ok ? 'go' : 'err');
    } else mergePrev = { room: selected, dir };
    renderObjPanel(); return;
  }
  if (act === 'upgrade' || act === 'upgradeFloor') {
    if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; }
    const r = act === 'upgrade' ? game.upgrade(selected) : game.upgradeFloor(selected.f);
    setHint(r.ok ? 'Aufgewertet (−' + euro(r.cost) + ')' : r.reason, r.ok ? 'go' : 'err');
    renderObjPanel(); return;
  }
  if (act === 'loan') { const r = game.takeLoan(); setHint(r.ok ? 'Kredit: +' + euro(r.amount) : r.reason, r.ok ? 'go' : 'err'); openMoney(); return; }
  if (act === 'repay') { const r = game.repayLoan(b.dataset.amt === 'all' ? null : +b.dataset.amt); setHint(r.ok ? 'Zurückgezahlt: ' + euro(r.amount) : r.reason, r.ok ? 'go' : 'err'); openMoney(); return; }
  if (act === 'help') { openHelp(); return; }
  if (act === 'save') { const sl = readSlots(); openSave(curSlot != null ? curSlot : Math.max(0, sl.indexOf(null))); return; }
  if (act === 'load') { openLoad(); return; }
  if (act === 'dev') { openDev(); return; }
  if (act === 'devLoad') {
    if (b.dataset.armed) { loadDev(+b.dataset.dev); return; }
    panelEl.querySelectorAll('.slot[data-armed]').forEach(x => { delete x.dataset.armed; x.classList.remove('on'); });
    b.dataset.armed = '1'; b.classList.add('on'); b.querySelector('small').textContent = 'Nochmal tippen = laden (ersetzt das laufende Spiel)';
    return;
  }
  if (act === 'pickSlot') { openSave(+b.dataset.slot); return; }
  if (act === 'saveSlot') { saveToSlot(+b.dataset.slot); return; }
  if (act === 'delSlot') {
    if (b.dataset.armed) { delSlot(+b.dataset.slot); openLoad(); } else { b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = 'löschen?'; }
    return;
  }
  if (act === 'loadSlot') {
    if (b.dataset.armed) { loadSlot(+b.dataset.slot); return; }
    panelEl.querySelectorAll('.slot[data-armed]').forEach(x => { delete x.dataset.armed; x.classList.remove('on'); });
    b.dataset.armed = '1'; b.classList.add('on'); b.querySelector('small').textContent = 'Nochmal tippen = laden (ersetzt das laufende Spiel)';
    return;
  }
  if (act === 'log') { openLog(); return; }
  if (act === 'diary') { openDiary(); return; }
  if (act === 'looks') { openLooks(); return; }
  if (act === 'setLook') {
    if (b.classList.contains('dis')) { setHint(b.title, 'err'); return; }
    const r = game.setLook(b.dataset.kind, b.dataset.key);
    if (!r.ok) setHint(r.reason, 'err');
    openLooks(); return;
  }
  if (act === 'new') { closePanel(); openStart('new', true); }
});

// workshop panel: the slider sets the wear at which jobs open (the panel refreshes without redrawing it)
panelEl.addEventListener('input', e => {
  if (e.target.dataset.act !== 'serviceAt') return;
  game.serviceAt = +e.target.value;
  const l = document.getElementById('serviceAtVal'); if (l) l.textContent = game.serviceAt + ' %';
});

function statusText(st) {
  return { good: '<span class="st-good">gut</span>', ok: '<span class="st-ok">geht so</span>', bad: '<span class="st-bad">schlecht – über der Schwelle</span>',
    vacant: 'frei – Mieter kommen nach und nach', unreachable: '<span class="st-bad">nicht erreichbar – kein Weg aus der Lobby, oder er kostet zu viel Kraft</span>', lobby: 'Umsteige-Etage' }[st];
}

function energyText(e) {
  const cls = e >= CFG.energyGood ? 'st-good' : e >= CFG.energyOk ? 'st-ok' : 'st-bad';
  const word = e >= CFG.energyGood ? 'frisch' : e >= CFG.energyOk ? 'müde' : 'erschöpft';
  return `<span class="${cls}">${Math.round(e * 100)} % – ${word}</span>`;
}

const COND = { ok: 'fährt', slow: '<span class="st-ok">langsam – verschlissen</span>', waiting: '<span class="st-ok">wartet auf Handwerker</span>',
  repair: '<span class="st-ok">🔧 in Reparatur</span>', broken: '<span class="st-bad">⚠ Panne</span>',
  inspect: '<span class="st-ok">⏸ Prüfung nach dem Beben</span>' };
function wearBar(w) {
  const cls = w >= 100 ? 'bad' : w >= CFG.wear.slowAt || w >= game.serviceAt ? 'ok' : '';
  return `<span class="bar" title="Verschleiß ${Math.round(w)} %"><i class="${cls}" style="width:${Math.min(100, w).toFixed(0)}%"></i></span>`;
}
function signedEuro(n) { return `<span class="${n < 0 ? 'neg' : 'pos'}">${n < 0 ? '−' : '+'}${euro(Math.abs(n))}</span>`; }
function floorNetRow(f) {
  return game.floorNet ? `<span>Etage netto gestern</span><span>${signedEuro(game.floorNetAt(f))}</span>` : '';
}

// one row per car: wear bar, condition, emergency button when it is broken and nobody comes
function carRows(o) {
  let rows = '';
  o.cars.forEach((car, i) => {
    let st = COND[car.cond] || car.cond;
    if (car.cond === 'waiting' && car.mech && car.mech.emergency) st = '<span class="st-ok">🚨 Notdienst unterwegs</span>';
    else if (car.cond === 'waiting' && car.fix === 'park') st = '<span class="st-ok">fährt leer zur Wartung</span>';
    let btn = '';
    if (car.cond === 'broken') {
      const chk = game.checkEmergency(o, car);
      btn = `<button class="btn warn ${chk.ok ? '' : 'dis'}" data-act="emergency" data-car="${i}" title="${chk.ok ? 'Kommt in ' + Math.round(CFG.emergency.delaySec / 60) + ' Min. durch den Eingang' : chk.reason}">🚨 Notdienst rufen (${euro(chk.cost)})</button>`;
      if (!chk.ok) btn += `<span style="color:var(--muted);font-size:11.5px">${chk.reason}</span>`;
    }
    rows += `<span>Kabine ${i + 1}</span><span>${wearBar(car.wear)} ${Math.round(car.wear)} %</span><span>${st}</span>`;
    if (btn) rows += `<span></span><span style="grid-column: span 2">${btn}</span>`;
  });
  return rows;
}

function renderWorkshopPanel(o) {
  const def = CFG.rooms[o.type];
  const ws = game.workshopStats();
  const staff = (o.staff || []).map((p, i) => {
    let s = p.state === 'out' ? 'nicht da' : p.state === 'in' ? (p.restUntil > game.t ? 'ruht sich aus (müde)' : 'in der Werkstatt') : '';
    if (p.job) {
      const sh = p.job.s, carName = sh.name + (sh.cars.length > 1 ? '/' + (sh.cars.indexOf(p.job.car) + 1) : '');
      s = p.job.car.fix === 'repair' ? 'repariert Aufzug ' + carName : p.state === 'work' ? 'wartet an Aufzug ' + carName : 'unterwegs zu Aufzug ' + carName;
    } else if (!s) s = p.mGoal === 'out' ? 'geht nach Hause' : 'unterwegs';
    return `<span>Handwerker ${i + 1}</span><span>${s}</span>`;
  }).join('');
  const stats = `<div class="kv">
    <span>Etage</span><span>${floorName(o.f)}${game.roomStatus(o) === 'unreachable' ? ' – <span class="st-bad">nicht erreichbar</span>' : ''}</span>
    ${staff}
    <span>Ø Anlaufzeit heute</span><span>${ws.avgApproachMin == null ? '–' : ws.avgApproachMin.toFixed(1).replace('.', ',') + ' Min.'}</span>
    <span>Aufträge heute</span><span>${ws.jobsToday}</span>
    <span>Ausfälle heute</span><span>${ws.breakdownsToday ? '<span class="st-bad">' + ws.breakdownsToday + '</span>' : 0}</span>
    <span>Betrieb</span><span>${euro(def.upkeep)} pro Tag, Teile ${euro(CFG.repair.parts)} je Reparatur</span>
    ${providerRows(o)}${floorNetRow(o.f)}</div>`;
  const key = 'ws' + o.id;
  if (panelMode === 'obj' && panelEl.dataset.key === key) { document.getElementById('wsStats').innerHTML = stats; return; }
  openPanel(`<h3>${def.icon} ${def.label}<button class="close" data-act="close">✕</button></h3>
    <div id="wsStats">${stats}</div>
    <p>Wartung ab Verschleiß <b id="serviceAtVal">${game.serviceAt} %</b> (gilt für alle Aufzüge):</p>
    <input type="range" min="${CFG.serviceMin}" max="${CFG.serviceMax}" step="5" value="${game.serviceAt}" data-act="serviceAt">
    <p>Früh warten = viele kurze Pausen, nie Pannen. Spät warten = seltener, aber eine Panne in der Mittagswelle wird teuer. Handwerker fahren selbst Aufzug – eine Werkstatt nah an den Schächten kommt schneller hin.</p>`, 'obj');
  panelEl.dataset.key = key;
}

// ----- needs, penalties, tiers (TOWER-a0006 P2) -----
const pct = v => Math.round(v * 100) + ' %';
const minTxt = m => Math.round(m) + ' Min.';
function shareCls(v) { return TowerEngine.needWarn(v) ? 'st-bad' : v >= CFG.needHeat.good ? 'st-good' : 'st-ok'; }
const isTenant = o => o.type === 'office' || o.type === 'condo';

// list of needs: provider with felt minutes, forecast, yesterday's measurement; penalty; warning
function needsHtml(o) {
  const fc = game.forecast(o, o.tier), measured = (o.occupied || o.type === 'hotel') && o.fulfil != null;
  const v = measured ? o.fulfil : fc.fulfil;
  let h = `<p>Bedürfnisse ${o.merged > 1 ? game.roomLabel(o) : CFG.tiers[o.tier].label}: Erfüllung <b class="${shareCls(v)}">${pct(v)}</b>${measured ? '' : ' (Vorhersage)'}</p>`;
  if (fc.needs.length) {
    h += '<div class="needs"><span class="hd">Bedürfnis</span><span class="hd">Versorger, gefühlt</span><span class="hd">Vorhersage</span><span class="hd">gestern</span>';
    for (const e of fc.needs) {
      const prov = e.min == null ? `<span class="st-bad">${e.reason}</span>`
        : (e.type === 'street' ? 'Straße (EG)' : CFG.rooms[e.type].label + ' ' + floorName(e.provider.f)) + ', ' + minTxt(e.min);
      const ms = e.measured == null ? '–' : `<span class="${shareCls(e.measured)}">${pct(e.measured)}</span>` + (e.measuredMin != null ? ' · ' + minTxt(e.measuredMin) : '');
      h += `<span>${CFG.needs[e.need].label}</span><span>${prov}</span><span class="${shareCls(e.share)}">${pct(e.share)}</span><span>${ms}</span>`;
    }
    h += '</div>';
  } else h += '<p class="fc">Keine Bedürfnisse auf dieser Stufe – nur Lärm zählt.</p>';
  const src = game.penaltySources(o)[0];
  if (o.pen > 0 && src) h += `<p class="fc">Lärm: <span class="st-bad">−${pct(o.pen)}</span> von ${CFG.rooms[src.room.type].label} ${floorName(src.room.f)} (die stärkste Quelle zählt)</p>`;
  if (o.type === 'hotel') return h;
  if (!o.occupied && o.needOut) h += `<div class="warnbox">Ausgezogen wegen Bedürfnissen. Neue Mieter erst nach einer Bauänderung und ab ${pct(CFG.moveInMin)} Vorhersage.</div>`;
  else if (!o.occupied && fc.fulfil < CFG.moveInMin) h += `<p class="fc">Neue Mieter erst ab ${pct(CFG.moveInMin)} Vorhersage.</p>`;
  return h;
}

// sign over the room (TOWER-a0007): yellow = close to the threshold, red = below it, the tenants may go any hour
function warnHtml(o) {
  const lv = game.warnLevel(o);
  if (!lv) return '';
  const why = game.warnReason(o).replace(/\.$/, '');   // "… 18 Min." ends with a dot already
  if (lv === 1) return `<div class="warnbox">⚠ Knapp vor der Schwelle: ${why}. Noch kein Auszug – die Schwelle ist Ø über ${CFG.okMin} Min. pro Weg oder höchstens ${pct(CFG.warnBelow)} Erfüllung.</div>`;
  const d = o.warnDays, [a, b] = CFG.moveOutHours, P = game.moveOutChance(o);
  // offices: only a good full day (Tu–Th) takes the warning away (TOWER-a0009); closed rooms are not checked
  const out = P > 0 ? ` Heute ziehen die Mieter mit <b>${pct(P)}</b> Wahrscheinlichkeit aus (jede Stunde ${a}–${b} Uhr ein Teil davon); ab morgen mehr.` : '';
  return `<div class="warnbox red">⚠ Unter der Schwelle, ${d}. Tag: ${why}.${out} ${o.type === 'office' ? 'Ein guter voller Bürotag (Di–Do)' : 'Ein guter Tag'} nimmt die Warnung weg.</div>`;
}

// forecast text for a tier: "voraussichtlich 35 %: Supermarkt 14 Min., kein Fitness erreichbar"
function forecastText(f) {
  const parts = f.needs.map(e => e.reason);
  if (f.pen > 0) parts.push('Lärm −' + pct(f.pen));
  return `voraussichtlich <b class="${shareCls(f.fulfil)}">${pct(f.fulfil)}</b>${parts.length ? ': ' + parts.join(', ') : ''}`;
}

// upgrade buttons (room, whole floor) with the forecast on the next tier first
function upgradeHtml(o) {
  const nt = CFG.tiers[o.tier + 1];
  if (!nt) return '';
  const c = game.checkUpgrade(o), cf = game.checkUpgradeFloor(o.f);
  let h = '';
  if (!nt.locked && nt.star <= game.stars) {
    const rent = CFG.rooms[o.type].rent;
    h += `<p class="fc">▲ ${nt.label}: ${forecastText(game.forecast(o, o.tier + 1))} · Miete bis ${euro(game.potentialRent(o, o.tier + 1))}, Betrieb +${euro(Math.round(rent * nt.upkeep))} pro Tag</p>`;
  }
  h += `<div class="btnrow"><button class="btn ${c.ok ? '' : 'dis'}" data-act="upgrade" title="${c.ok ? 'Aufwerten' : c.reason}">▲ Aufwerten (${euro(c.cost)})</button>`
    + `<button class="btn ${cf.ok ? '' : 'dis'}" data-act="upgradeFloor" title="${cf.ok ? 'Ganze Etage aufwerten' : cf.reason}">▲ ganze Etage${cf.n ? ' (' + cf.n + ', ' + euro(cf.cost) + ')' : ''}</button></div>`;
  if (!c.ok) h += `<p class="fc">${c.reason}</p>`;
  else h += '<p class="fc">Kein Zurück: Abwerten geht nicht, nur Abriss und Neubau.</p>';
  return h;
}

// merging side by side (★★★, TOWER-a0010 P6, E12/E34): „⇔ mit links“ / „⇔ mit rechts“ when the direct neighbour fits
// (same kind, both luxury, no warning, at most CFG.merge.max rooms); first tap = preview, second tap = merge
function mergeHtml(o) {
  let btns = '', prev = '';
  for (const dir of [-1, 1, 'up', 'whole']) {   // E37: „⇕ mit oben“ (★★★★) – the 2er directly above; E51: „⇔ ganze Etage“ (★★★★★) from a 3er
    const c = dir === 'up' ? game.checkMergeUp(o) : dir === 'whole' ? game.checkWhole(o) : game.checkMerge(o, dir);
    if (!c.ok && c.reason !== 'Zu wenig Geld') continue;
    const armed = mergePrev && mergePrev.room === o && mergePrev.dir === dir;
    const side = dir === 'up' ? 'oben' : dir === 'whole' ? 'der ganzen Etage' : dir < 0 ? 'links' : 'rechts', sym = dir === 'up' ? '⇕' : '⇔';
    btns += `<button class="btn ${c.ok ? '' : 'dis'} ${armed ? 'on' : ''}" data-act="merge" data-dir="${dir}" title="${c.ok ? 'Zusammenlegen mit ' + side : c.reason}">${armed ? sym + ' Jetzt zusammenlegen (' + euro(c.cost) + ')' : dir === 'whole' ? '⇔ ganze Etage' : sym + ' mit ' + side}</button>`;
    if (!armed) continue;
    const T = c.tenantType && CFG.tenants[c.tenantType];
    prev = `<p class="fc">${sym} ${c.n} Räume${dir === 'up' ? ' über zwei Etagen (Viererblock)' : dir === 'whole' ? ' – die ganze Etage' : ''} → <b>${T ? T.icon + ' ' + T.label : c.label}</b> (${c.why}) · ${c.people} Personen · Bedürfnisse: ${c.needs.map(n => CFG.needs[n].label).join(', ') || 'keine'}`
      + ` · Miete bis ${euro(c.rent)} statt ${euro(c.rentBefore)} pro Tag · ${forecastText(c.forecast)} · Kosten ${euro(c.cost)} (${dir === 'up' ? Math.round(CFG.merge.vertShare * 100) + ' % der vier Baupreise' : dir === 'whole' ? Math.round(CFG.merge.whole.share * 100) + ' % der Baupreise der noch nicht zusammengelegten Räume' : Math.round(CFG.merge.share * 100) + ' % des Baupreises je neu dazukommendem Raum'}).</p>`
      + (c.tenantType === 'callcenter' ? `<div class="warnbox red">⚠ Falle: Lärm im Umfeld – es käme ein Callcenter: Miete × ${String(T.rent).replace('.', ',')}, doppelt so viele Leute, viel Verkehr.</div>` : '')
      + `<p class="fc">Die jetzigen Mieter ziehen aus, neue ziehen danach ein. Nochmal tippen = zusammenlegen. Kein Zurück außer Abriss.</p>`;
  }
  return btns ? `<div class="btnrow">${btns}</div>${prev}` : '';
}

// P3 (E21): private stop of an express – a button per floor with a merged room (≥ 3), the one set to take it away
function privHtml(s) {
  const P = CFG.priv, fs = game.privFloorsFor(s);
  if (s.priv != null && !fs.includes(s.priv)) fs.unshift(s.priv);
  const info = `Prestige-Mieter mit eigenem Halt: der Express hält zusätzlich auf einer Etage mit einem zusammengelegten Raum (≥ ${P.minMerged}) – kein Umsteigen, keine Lobby. Kanzlei und Penthouse zahlen dort ${String(P.rentK).replace('.', ',')}-fache Miete. ${euro(P.cost)} + ${euro(P.upkeep)}/Tag, einer je Express. Jeder Privathalt bremst den Express für alle.`;
  if (!fs.length) return `<p class="fc">⭐ ${info}</p>`;
  return `<div class="btnrow">${fs.slice(0, 6).map(f => {
    const c = game.checkPriv(s, f), on = s.priv === f;
    return `<button class="btn ${on ? 'on' : ''} ${c.ok ? '' : 'dis'}" data-act="priv" data-f="${f}" title="${c.ok ? (on ? 'Privathalt aufheben' : 'Privathalt hier (' + euro(c.cost) + ')') : c.reason}">⭐ Privathalt ${floorName(f)}${on ? ' an' : ''}</button>`;
  }).join('')}</div><p class="fc">${info}</p>`;
}

// rows for a provider (café, Kita, supermarket, fitness) and for disturbers
function providerRows(o) {
  const def = CFG.rooms[o.type];
  let rows = '';
  if (def.seats && o.type !== 'restaurant') {
    rows += `<span>Plätze</span><span>${o.inside} von ${def.seats} belegt${o.queue.length ? ', <span class="st-ok">' + o.queue.length + ' warten</span>' : ''}</span>
      <span>Pro ${o.type === 'daycare' ? 'Kind und Tag' : 'Besuch'}</span><span>${def.prices ? Object.keys(def.prices).map(k => CFG.needs[k].label + ' ' + euro(def.prices[k])).join(', ') : euro(def.price)}</span>
      <span>Betrieb</span><span>${euro(def.upkeep)} pro Tag</span>
      <span>Besuche</span><span>heute ${o.vN}${o.lastVisits != null ? ', gestern ' + o.lastVisits : ''}</span>`;
    if (o.lastQ || o.lastGU) rows += `<span>Schlange gestern</span><span>Ø ${o.lastQ.toFixed(1).replace('.', ',')} Min.${o.lastGU ? ', <span class="st-bad">' + pct(o.lastGU) + ' aufgegeben</span>' : ''}</span>`;
  }
  if (def.provides) rows += `<span>Deckt ab</span><span>${def.provides.map(k => CFG.needs[k].label).join(', ')} – wie ${def.provides.map(k => CFG.rooms[CFG.needs[k].provider].label).join(' und ')}</span>`;
  if (def.guestWhen) rows += `<span>Gäste von außen</span><span>~${def.guests} je Abend ${def.guestWhen.map(t => t / 3600).join('–')} Uhr (Wochenende doppelt)</span>`;
  if (def.public) {   // E29 public rooms
    const days = def.visitDays.length === 6 ? 'Mo–Sa' : 'werktags';
    rows += `<span>Besucher</span><span>~${def.visitors} ${days} ${def.visitWhen.map(w => w.map(t => fmtTime(t)).join('–')).join(' und ')} Uhr${def.visitK ? ' (samstags doppelt)' : ''}${def.until ? ', bleiben bis ' + fmtTime(def.until) : ''} – weniger bei langen Wegen</span>`;
  }
  if (o.type === 'spacestation') {   // P9 (E54): tourists every day, by street, train or airship
    const L = game.lastDay;
    rows += `<span>Touristen</span><span>~${def.tourists} täglich ${def.visitWhen.map(w => w.map(t => fmtTime(t)).join('–')).join(', ')} Uhr, von der Straße, mit der Bahn oder dem Luftschiff – weniger bei langen Wegen${L && L.tourists ? ' · gestern ' + L.tourists + (L.touristsVia ? ', davon ' + L.touristsVia + ' über Bahnhof/Luftschiff' : '') : ''}</span>`;
  }
  if (def.walkInHours) rows += `<span>Laufkundschaft</span><span>~${def.walkIn} ${def.walkInDays && def.walkInDays.length === 6 ? 'Mo–Sa (samstags doppelt)' : 'werktags'} ${def.walkInHours.map(t => t / 3600).join('–')} Uhr</span>`;
  if (def.noPeople) {   // E36: server, self-storage – tenants without people
    const cool = game.coolingFor(o);
    rows += `<span>Miete</span><span>${euro(game.rentOf(o))} pro Tag, immer vermietet, keine Leute${def.skyAll && o.roofed ? ' – <span class="st-bad">überbaut: keine Pacht</span>' : ''}</span>`
      + (def.cool != null ? `<span>Kühlung</span><span>${cool ? 'Technikebene ' + floorName(cool.f) + ' (' + Math.abs(cool.f - o.f) + ' Etagen) – volle Miete' : '<span class="st-bad">keine Technikebene höchstens ' + def.cool + ' Etagen entfernt – halbe Miete</span>'}</span>` : '')
      + (def.seats ? '' : `<span>Betrieb</span><span>${euro(def.upkeep)} pro Tag</span>`);
  }
  if (def.open) rows += `<span>Himmel</span><span>${o.roofed ? '<span class="st-bad">überbaut – ' + (def.guests ? 'nur halb so viele Gäste, halber Beitrag' : def.seats ? 'halber Beitrag' : def.power ? 'kein Strom' : def.rent ? 'keine Pacht' : 'wirkt nicht') + '</span>' : 'frei'}</span>`
    + (def.guests ? `<span>Gäste von außen</span><span>~${Math.round(def.guests * (o.roofed ? 0.5 : 1))} je Abend (Wochenende doppelt)</span>` : '');
  if (def.power) {   // P8 (E52): geothermal, wind turbine
    const off = def.open && (o.roofed || game.weatherToday.storm), P = game.powerInfo();
    rows += `<span>Strom</span><span>${off ? '<span class="st-bad">liefert heute nichts' + (game.weatherToday.storm && !o.roofed ? ' (Sturm)' : '') + '</span>' : def.power + ' MW'}${game.stars >= CFG.power.star ? ' · Turm ' + game.powerText() : ' (Strom zählt erst ab ' + '★'.repeat(CFG.power.star) + ')'}</span><span>Betrieb</span><span>${euro(def.upkeep)} pro Tag, kein Erlös</span>`;
  }
  if (o.type === 'hotel') {
    const occ = o.lastOcc;
    rows += `<span>Zimmer belegt</span><span>${o.guests.length} von ${def.suites}</span>
      <span>Auslastung gestern</span><span>${occ == null ? '–' : pct(occ)}${occ ? ' · zählt ' + Math.round(occ * 2) + ' Luxus belegt' : ''}</span>
      <span>Gäste</span><span>${o.people.filter(p => p.state !== 'out').length} im Haus${o.req ? ', heute ' + o.req + ' Anfragen' : ''}${o.checkins ? ', ' + o.checkins + ' eingecheckt' : ''}</span>
      <span>Pro Gast und Nacht</span><span>${euro(def.night)}</span>
      <span>Betrieb</span><span>${euro(def.upkeep)} pro Tag</span>`;
  }
  if (def.spaces) {   // garage, station, heliport (E27)
    rows += `<span>Plätze</span><span>${o.parked} belegt von ${def.spaces}, ${o.assigned} Mieter vorgesehen</span>
      <span>Nutzer</span><span>heute ${o.users}, gestern ${o.lastUsers}${o.type === 'station' ? ' (Mieter und Besucher)' : ''}</span>
      <span>Erlös</span><span>${euro(def.perUser)} je Nutzer und Tag · gestern ${euro(o.lastUsers * def.perUser)}</span>
      <span>Betrieb</span><span>${euro(def.upkeep)} pro Tag</span>`;
  }
  const N = CFG.noise[o.type];
  if (N) rows += `<span>Lärm</span><span>bis −${pct(N.s)} für Nachbarn (Radius ${String(N.r).replace('.', ',')} Etagen)</span>`;
  return rows;
}

function renderObjPanel() {
  const o = selected; if (!o) return;
  selInfo = null;
  if (o.type && CFG.rooms[o.type]) {
    if (isTenant(o)) selInfo = { room: o, shares: game.providerShares(o), sources: game.penaltySources(o) };
    else if (CFG.noise[o.type]) selInfo = { room: o, area: game.penaltyArea(o.type, o.f, o.x) };
  }
  if (o.type === 'workshop') { renderWorkshopPanel(o); return; }
  if (o.cars) {
    const def = CFG.shafts[o.kind];
    const waiting = o.qUp.reduce((a, q) => a + q.length, 0) + o.qDown.reduce((a, q) => a + q.length, 0);
    const avg = o.waitN ? (o.waitSum / o.waitN / 60).toFixed(1).replace('.', ',') + ' Min.' : '–';
    let chips = '';
    for (let f = o.f1; f >= o.f0; f--) {
      const possible = game.stopAllowed(o, f);
      const on = o.stops[f - o.f0] && possible;
      chips += `<span class="chip ${on ? 'on' : ''} ${possible ? '' : 'dis'}" data-act="stop" data-f="${f}">${f > 0 ? f : floorName(f)}</span>`;
    }
    const up = game.checkExtend(o, 1), down = game.checkExtend(o, -1);
    const extBtn = (chk, dir, lb) => `<button class="btn ${chk.ok ? '' : 'dis'}" data-act="extend" data-dir="${dir}" title="${chk.ok ? lb + ' (' + euro(chk.cost) + ')' : chk.reason}">${lb}</button>`;
    openPanel(`<h3>${def.label} ${o.name}<button class="close" data-act="close">✕</button></h3>
      <div class="kv"><span>Etagen</span><span>${floorName(o.f0)} – ${floorName(o.f1)} · ${o.f1 - o.f0} von höchstens ${def.maxSpan} Etagen hoch${o.priv != null ? ' · ⭐ Privathalt ' + floorName(o.priv) : ''}</span>
      <span>Wartende jetzt</span><span>${waiting}</span>
      <span>Ø Wartezeit heute</span><span>${avg}</span>
      <span>Kabinen</span><span>${o.cars.length} von ${def.maxCars} · je ${def.cap} Personen</span>
      <span>Betrieb</span><span>${euro(game.shaftUpkeep(o))} pro Tag (${euro(def.upkeep)} je Kabine${o.dd ? ' + ' + euro(CFG.dispatch.upkeep) + ' Zielwahl' : ''}${o.priv != null ? ' + ' + euro(CFG.priv.upkeep) + ' Privathalt' : ''})</span>
      <span>Wartung</span><span>${o.svc == null ? '<span class="st-bad">nicht möglich – keine Halte-Etage mit Boden</span>' : 'im ' + floorName(o.svc) + ' ab ' + game.serviceAt + ' % Verschleiß' + (game.rooms.some(r => r.type === 'workshop') ? '' : ' – <span class="st-ok">keine Werkstatt gebaut</span>')}</span></div>
      ${def.decks ? `<p class="fc">🚡 Hält nur auf jeder zweiten Etage: Unterdeck im ${floorName(o.f0)}, ${floorName(o.f0 + 2)}, …, Oberdeck eine Etage höher – beide gleichzeitig. Wer auf einer Etage des Oberdecks einsteigt, kommt nur auf Etagen des Oberdecks (Rolltreppe ${floorName(o.f0)}–${floorName(o.f0 + 1)}).</p>` : ''}
      ${def.twin ? (() => { const u = game.checkSplit(o, 1), d = game.checkSplit(o, -1); return `<p class="fc">⇅ Kabine 1 fährt ${floorName(o.f0)}–${floorName(o.split)}, Kabine 2 ${floorName(o.split)}–${floorName(o.f1)}. Im ${floorName(o.split)} steigt man um wie in einer Lobby: unten fährt dort nur abwärts los, oben nur aufwärts.</p>
      <div class="btnrow"><button class="btn ${u.ok ? '' : 'dis'}" data-act="split" data-dir="1" title="${u.ok ? 'Teilung ins ' + floorName(u.f) : u.reason}">▲ Teilung höher</button><button class="btn ${d.ok ? '' : 'dis'}" data-act="split" data-dir="-1" title="${d.ok ? 'Teilung ins ' + floorName(d.f) : d.reason}">▼ Teilung tiefer</button><span style="color:var(--muted);font-size:12px">Teilung im ${floorName(o.split)}, kostenlos</span></div>`; })() : ''}
      ${def.svcOnly ? `<p class="fc">🧹 Nur für Reinigung und Handwerker – Mieter und Besucher fahren nie mit. Reinigung und Handwerker nehmen ihn, wenn ein Weg über Dienstaufzüge und Treppen ans Ziel führt.</p>` : ''}
      ${def.noRiders ? `<p class="fc">🚒 Fährt keine Fahrgäste. Über dem ${CFG.fireLift.from}. OG wird nur gebaut, wenn ein Feuerwehraufzug ab dem EG bis ${CFG.fireLift.gap} Etagen unter die neue Etage reicht – zum Höherbauen ▲ verlängern.</p>` : ''}
      <p>Verschleiß und Zustand (ab ${CFG.wear.slowAt} % langsamer, bei 100 % Panne):</p>
      <div class="cars">${carRows(o)}</div>
      ${CFG.dispatch.kinds.includes(o.kind) ? (() => { const c = game.checkDispatch(o); return `<div class="btnrow"><button class="btn ${o.dd ? 'on' : ''} ${c.ok ? '' : 'dis'}" data-act="dispatch" title="${c.ok ? (o.dd ? 'Zielwahl ausschalten' : 'Zielwahl einbauen (' + euro(c.cost) + ')') : c.reason}">🎯 Zielwahl ${o.dd ? 'an' : 'aus'}</button><span style="color:var(--muted);font-size:12px">${o.dd ? 'Die Kabinen teilen die Ziele unter sich auf – weniger Halte, schnellere Runden.' : euro(CFG.dispatch.cost) + ' + ' + euro(CFG.dispatch.upkeep) + '/Tag: die Kabinen teilen die Ziele unter sich auf'}</span></div>`; })() : ''}
      ${def.lobbyOnly && !def.stopEvery ? privHtml(o) : ''}
      ${def.cars ? '' : `<div class="btnrow"><button class="btn" data-act="delcar">− Kabine</button><button class="btn" data-act="addcar">+ Kabine (${euro(def.car)})</button></div>`}
      <div class="btnrow">${extBtn(up, 1, '▲ Oben +1')}${extBtn(down, -1, '▼ Unten +1')}<span style="color:var(--muted);font-size:12px">je ${euro(def.perFloor)}</span></div>
      <p>Halte (antippen = an/aus)${def.stopEvery ? ' – ' + def.label + ' hält nur im EG, am Tiefbahnhof und auf Lobbys im ' + def.stopEvery + '., ' + 2 * def.stopEvery + '. … OG' : def.lobbyOnly ? ' – ' + def.label + ' hält nur in Lobbys' : ''}:</p>
      <div class="chips">${chips}</div>`, 'obj');
  } else if (o.isShell) {
    openPanel(`<h3>${CFG.shell.icon} ${CFG.shell.label}<button class="close" data-act="close">✕</button></h3>
      <div class="kv"><span>Etage</span><span>${floorName(o.f)}</span><span>Breite</span><span>${o.w} Felder</span>
      <span>Etage kostet</span><span>${o.f !== 0 ? euro(game.floorUpkeep(o.f)) + ' pro Tag' : 'nichts (Lobby)'}</span>${floorNetRow(o.f)}</div>
      <p>Boden ohne Mieter: hier kann man laufen und am Aufzug anstehen. Räume lassen sich direkt darauf bauen; wird ein Raum abgerissen, bleibt der Rohbau stehen. Jede Etage mit Boden kostet Betrieb, oben mehr, im Keller je tiefer, desto mehr.</p>`, 'obj');
  } else if (o.isLink) {
    const def = CFG.links[o.kind];
    openPanel(`<h3>${def.icon} ${def.label}<button class="close" data-act="close">✕</button></h3>
      <div class="kv"><span>Verbindet</span><span>${floorName(o.f)} ↔ ${floorName(o.f + 1)}</span>
      <span>Benutzt heute</span><span>${o.used}×</span>
      <span>Dauer</span><span>hoch ${(def.up / 60).toLocaleString('de-DE')} Min., runter ${(def.down / 60).toLocaleString('de-DE', { maximumFractionDigits: 1 })} Min. pro Etage</span>
      <span>Komfort</span><span>zählt ${String(def.comfort).replace('.', ',')}-fach als Wegzeit</span>
      <span>Energie</span><span>hoch ${def.energyUp}, runter ${def.energyDown} je Etage (jeder hat ${CFG.energy.min}–${CFG.energy.max})</span></div>`, 'obj');
  } else {
    const def = CFG.rooms[o.type];
    const st = game.roomStatus(o);
    const live = game.liveAvg(o);
    let rows = `<span>Etage</span><span>${floorName(o.f)}${o.h === 2 ? ' – ' + floorName(o.f + 1) : ''}</span><span>Zustand</span><span>${statusText(st)}</span>`;
    let more = '';
    if (isTenant(o)) {
      rows += `<span>Stufe</span><span>${CFG.tiers[o.tier].label}</span>
        <span>Mieter</span><span>${o.occupied ? o.people.length + ' Personen, ' + o.inside + ' drin' : '–'}</span>
        <span>Miete</span><span>${o.occupied ? euro(game.rentOf(o)) + ' pro Tag' + (o.fulfil != null && o.fulfil < 1 ? ' (' + pct(o.fulfil) + ' von ' + euro(game.potentialRent(o)) + ')' : '') : 'bis ' + euro(game.potentialRent(o)) + ' pro Tag'}</span>`;
      if (o.tier) rows += `<span>Betrieb Stufe</span><span>${euro(game.tierUpkeep(o))} pro Tag, auch leer</span>`;
      if (o.merged > 1) {   // P6: tenant type (fixed when the tenants moved in; vacant: who would come now)
        const T = o.tenantType && CFG.tenants[o.tenantType];
        rows += `<span>Mietertyp</span><span>${T ? T.icon + ' ' + T.label : '–'}${o.occupied ? '' : ' (käme jetzt)'}${game.staysForever(o) ? ' · kündigt nie' : ''}</span>
          ${T && T.visitors ? `<span>Besucher</span><span>~${T.visitors} ${T.visitDays.length === 7 ? 'täglich' : 'werktags'} ${T.visitWhen.map(w => w.map(t => fmtTime(t)).join('–')).join(', ')} Uhr, von der Straße oder mit der Bahn – ihre Wege zählen in der Bewertung${T.couriers ? '; doppelt so viele Kuriere' : ''}</span>` : ''}
          <span>Zusammengelegt</span><span>${o.merged} Räume, ${o.h === 2 ? '2 × ' + o.w + ' Felder über zwei Etagen (Viererblock, Eingang unten)' : o.w + ' Felder breit' + (o.whole ? ' – die ganze Etage' : '')} · Miete × ${String(T ? T.rent : 1).replace('.', ',')}${game.privK(o) > 1 ? ' · ⭐ Privathalt × ' + String(CFG.priv.rentK).replace('.', ',') : ''}</span>`;
      }
      more = warnHtml(o) + needsHtml(o) + upgradeHtml(o) + mergeHtml(o);
    }
    if (o.type === 'logistics') rows += `<span>Reinigung heute</span><span>${o.cleanings || 0} von höchstens ${def.rooms} Räumen, ${CFG.cleaning.center.map(t => fmtTime(t)).join('–')} Uhr${game.stars < CFG.cleaning.star ? ' (erst ab ' + '★'.repeat(CFG.cleaning.star) + ')' : ''}</span><span>Betrieb</span><span>${euro(def.upkeep)} pro Tag, kein Erlös</span>`;
    if (o.type === 'checkpoint') rows += `<span>Gesichert</span><span>${floorName(o.f)}: +${String(CFG.checkpoint.extraSec / 60).replace('.', ',')} Min. je Weg zu Büro oder Wohnung, Luxus-Büros × ${String(CFG.checkpoint.rentK).replace('.', ',')} Miete</span>`;   // E31
    if (o.type === 'gondola') {   // P6 (E34): protects f − reach … f from the ice above the cloud line
      const W = CFG.weather, wt = game.weatherToday;
      rows += `<span>Schützt</span><span>${floorName(Math.max(1, o.f - def.reach))} – ${floorName(o.f)} vor Eis (über dem ${floorName(W.line)} −${pct(W.iceDrop)} Erfüllung an Eistagen)</span>
        <span>Wetter heute</span><span>${game.stars < W.star ? 'erst ab ' + '★'.repeat(W.star) : [wt.fog && '🌫️ Nebel', wt.ice && '🧊 Eis', wt.storm && '🌪️ Sturm'].filter(Boolean).join(', ') || 'klar'}</span>
        <span>Betrieb</span><span>${euro(def.upkeep)} pro Tag, kein Erlös</span>`;
    }
    if (o.type === 'bridge') rows += `<span>Heute</span><span>${game.today.crossings || 0} Leute über die Brücke${game.lastDay && game.lastDay.crossings != null ? ' (gestern ' + game.lastDay.crossings + ')' : ''}</span><span>Lobby</span><span>${floorName(o.f)} in Turm A und B – hier steigt man um</span><span>Betrieb</span><span>${euro(def.upkeep)} pro Tag, kein Erlös</span>`;   // E43
    if (o.type === 'lockers') rows += `<span>Pakete heute</span><span>${o.parcels} abgegeben, ${o.booked} angekündigt, Platz für ${def.parcels}</span><span>Pro Paket</span><span>${euro(def.fee)}</span>`;
    if (o.type === 'restaurant') rows += `<span>Gäste drin</span><span>${o.inside} von ${def.seats}</span><span>Pro Gast</span><span>${euro(def.price)}</span>`;
    if (o.type === 'hotel') more = needsHtml(o) + `<p class="fc">Anfragen je Tag: ${def.suites} × Erfüllung gestern × Wegzeit, Fr/Sa doppelt so viele. Fest Luxus, kein Aufwerten.</p>`;
    rows += providerRows(o);
    if (o.type === 'spacestation') {   // P9 (E55): the platform and the goal
      const c = game.checkPlatform(o), G = game.goalInfo();
      rows += `<span>Plattform</span><span>${o.platform ? '🚀 gebaut · ' + G.text : 'noch nicht gebaut'}</span>`;
      if (!o.platform) more += `<div class="btnrow"><button class="btn ${c.ok ? '' : 'dis'}" data-act="platform" title="${c.ok ? 'Plattform bauen' : c.reason}">🚀 Plattform bauen (${euro(c.cost)})</button></div>`
        + `<p class="fc">${c.ok || /Geld/.test(c.reason) ? 'Das Ziel: steht die Plattform und sind ' + G.days + ' Abende in Folge mindestens ' + Math.round(G.sat * 100) + ' % zufrieden, fährt am nächsten Mittag die erste Kabine am Seil ins All. Danach läuft der Turm weiter.' : c.reason}</p>`;
    }
    if (o.damaged) {   // P3 (E20): the repair is a mechanic's way – pay, then a mechanic (or the emergency service) comes
      const c = game.checkRepair(o), m = o.mech;
      const state = o.repairEnd ? '🔧 Handwerker repariert – fertig gegen ' + fmtTime(o.repairEnd)
        : o.repairPaid ? (m ? (m.emergency ? '🚨 Notdienst' : '🔧 Handwerker') + ' ist unterwegs' : '🔧 bezahlt – wartet auf einen freien Handwerker (Werkstatt)')
        : '⚠ beschädigt – keine Miete, keine neuen Mieter';
      rows += `<span>Schaden</span><span class="st-bad">${state}</span>`;
      more = (o.repairPaid ? '' : `<div class="btnrow"><button class="btn warn ${c.ok ? '' : 'dis'}" data-act="repair" title="${c.ok ? 'Reparieren' : c.reason}">${c.emergency ? '🚨 Notdienst' : '🔧 Reparieren'} (${euro(c.cost)})</button></div>`
        + `<p class="fc">${c.ok ? (c.emergency ? 'Keine Werkstatt offen: der Notdienst kommt in ' + Math.round(CFG.emergency.delaySec / 60) + ' Min. durch den Eingang (+' + euro(CFG.emergency.cost) + ') und arbeitet ' + Math.round(CFG.quake.repairSec / 60) + ' Min.'
          : 'Ein Handwerker der Werkstatt läuft hin und arbeitet ' + Math.round(CFG.quake.repairSec / 60) + ' Min. (' + Math.round(CFG.quake.repairShare * 100) + ' % des Baupreises). Bis zum Abend unfertig: morgen geht es weiter.') : c.reason}</p>`) + more;
    } else if (o.shaken > 0) rows += `<span>Beben</span><span class="st-ok">Schreck: −${pct(CFG.quake.satDrop)} Erfüllung, noch ${o.shaken} ${o.shaken > 1 ? 'Abende' : 'Abend'}</span>`;
    // P6 weather above the cloud line (E33/E76): ice tonight, fog today
    if (o.wxDrop > 0 || (isTenant(o) && game.fogged(o))) rows += `<span>Wetter</span><span class="st-ok">${[o.wxDrop > 0 && (o.wxKind === 'storm' ? '🌪️ Sturm' : o.wxKind === 'both' ? '🧊 Eis + 🌪️ Sturm' : '🧊 Eis') + ': −' + pct(o.wxDrop) + ' Erfüllung heute (' + (o.wxKind === 'storm' ? '🌀 Schwingungsdämpfer hilft' : o.wxKind === 'both' ? '🚡 Fassadengondel und 🌀 Dämpfer helfen' : '🚡 Fassadengondel hilft') + ')', game.fogged(o) && '🌫️ Nebel: heute ohne Höhenzuschlag'].filter(Boolean).join(' · ')}</span>`;
    if (o.closed) rows += `<span>Wetter</span><span class="st-bad">${game.weatherToday.storm ? '🌪️ Sturm' : '🌫️ Nebel'} – heute geschlossen</span>`;   // E49/E50
    if (o.type === 'damper') {
      const L = CFG.rooms.damper.levels, lv = o.damperLevel, c = game.checkDamperUp(o), nx = L[lv];
      const cut = ['leicht', 'mittel', 'schwer'].map((nm, i) => nm + ' → ' + (i + 1 - lv > 0 ? CFG.quake.names[i + 1 - lv] : 'weg')).join(', ');
      rows += `<span>Stufe</span><span>${lv} von ${L.length}: ${L[lv - 1].label}</span>
        <span>Schützt</span><span>${floorName(Math.max(CFG.MIN_FLOOR, o.f - CFG.rooms.damper.reach))} – ${floorName(o.f)}</span>
        <span>Wirkung</span><span>${cut}</span>

      }).join('')}</div><p class="fc">Ab ${'★'.repeat(CFG.incidents.star)} gibt es Zwischenfälle. ${U.backup.icon} ${U.backup.label}: beim Stromausfall stehen die Aufzüge nur ${Math.round(CFG.incidents.backupSec / 60)} statt ${Math.round(CFG.incidents.outageSec / 60)} Min. (+${euro(U.backup.upkeep)}/Tag). ${U.leak.icon} ${U.leak.label}: ein Wasserschaden kostet keine Miete (+${euro(U.leak.upkeep)}/Tag). ${U.early.icon} ${U.early.label} (ab ${'★'.repeat(U.early.star)}): beim Erdbeben halten die Kabinen rechtzeitig – keine Prüfung, kein Verschleiß, kein Schacht defekt; die Räume trifft es wie sonst (+${euro(U.early.upkeep)}/Tag). Einer im Turm genügt.</p>`;
    }
    if (o.type !== 'skylobby' && !def.spaces && o.type !== 'tech' && o.type !== 'damper' && o.type !== 'server' && o.type !== 'gondola' && o.type !== 'bridge') {
      rows += `<span>Ø Weg heute</span><span>${live == null ? '–' : live.toFixed(1).replace('.', ',') + ' Min.'}</span>
        <span>Bewertung</span><span>${o.score == null ? '–' : o.score.toFixed(1).replace('.', ',') + ' Min. (gut ≤ ' + CFG.goodMin + ', schlecht > ' + CFG.okMin + ')'}</span>`;
      const en = game.liveEnergy(o);
      rows += `<span>Ø Energie bei Ankunft</span><span>${en == null ? '–' : energyText(en)}</span>`;
      if (o.failN) rows += `<span>Aufgegeben heute</span><span class="st-bad">${o.failN}× – Weg zu lang oder zu anstrengend</span>`;
    }
    rows += floorNetRow(o.f);
    const TT = o.merged > 1 && o.tenantType && CFG.tenants[o.tenantType];
    const title = o.merged > 1 ? (TT ? TT.icon + ' ' + TT.label + ' · ' : def.icon + ' ') + CFG.tiers[o.tier].label + (o.whole ? '-Etage (' + o.merged + ' ' + (o.type === 'office' ? 'Büros' : 'Wohnungen') + ')' : '-' + def.label + ' ×' + o.merged)
      : def.icon + ' ' + def.label + (o.tier ? ' · ' + CFG.tiers[o.tier].label : '');
    openPanel(`<h3>${title}<button class="close" data-act="close">✕</button></h3><div class="kv">${rows}</div>${more}`, 'obj');
  }
}

// ---------- save slots ----------
// meta list in one key (cheap to show), each game in its own key
const SLOTS_KEY = 'tower-game-slots-v1', SLOT_N = 6;
const slotKey = i => 'tower-game-slot-' + i + '-v1';
function readSlots() {
  let a = null;
  try { a = JSON.parse(localStorage.getItem(SLOTS_KEY)); } catch (e) { a = null; }
  a = Array.isArray(a) ? a : [];
  return Array.from({ length: SLOT_N }, (_, i) => a[i] || null);
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const stamp = ms => { const d = new Date(ms); return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); };
// stars from 0 since 30.10.2026: older saves and slot lists (no starsFrom) count from 1
const starCount = m => m.starsFrom === 0 ? m.stars : Math.max(0, (m.stars ?? 1) - 1);
const gameLine = m => 'Tag ' + m.day + ' · ' + euro(m.money) + ' · ' + ('★'.repeat(starCount(m)) || '☆') + (m.pop != null ? ' · 👥 ' + m.pop : '');
// the delete mark is a span, a button inside the slot button would not be valid HTML
function slotRow(m, i, act, on, extra) {
  return `<button class="slot${m ? '' : ' empty'}${on ? ' on' : ''}" data-act="${act}" data-slot="${i}"><span class="nr">${i + 1}</span>`
    + `<span class="nm"><b>${m ? esc(m.name) : 'leer'}</b><small>${m ? gameLine(m) + ' · ' + stamp(m.at) : 'freier Platz'}</small></span>${extra || ''}</button>`;
}
function openSave(pick) {
  const slots = readSlots();
  const rows = slots.map((m, i) => slotRow(m, i, 'pickSlot', i === pick)).join('');
  let form = '<p>Platz wählen.</p>';
  if (pick != null) {
    const m = slots[pick];
    const name = curName || (m ? m.name : 'Turm Tag ' + game.day);
    form = `<div class="btnrow"><input class="nameIn" id="slotName" maxlength="40" value="${esc(name)}" placeholder="Name">`
      + `<button class="btn on" data-act="saveSlot" data-slot="${pick}">${m ? 'Überschreiben' : 'Speichern'}</button></div>`;
  }
  openPanel(`<h3>Speichern<button class="close" data-act="close">✕</button></h3><div class="slots">${rows}</div>${form}`, 'save');
  const inp = document.getElementById('slotName');
  if (inp) { inp.focus(); inp.select(); inp.onkeydown = e => { if (e.key === 'Enter') saveToSlot(pick); }; }
}
function saveToSlot(i) {
  const inp = document.getElementById('slotName');
  const name = (inp && inp.value.trim()) || curName || 'Turm Tag ' + game.day;
  const slots = readSlots();
  const data = game.serialize(true);
  try {
    localStorage.setItem(slotKey(i), JSON.stringify(data));
    slots[i] = { name, at: Date.now(), day: game.day, money: data.money, stars: game.stars, starsFrom: 0, pop: game.population };
    localStorage.setItem(SLOTS_KEY, JSON.stringify(slots));
  } catch (e) { setHint('Speichern ging nicht – der Browser-Speicher ist voll oder gesperrt.', 'err'); return; }
  curSlot = i; curName = name; save(game, true);
  closePanel(); toast('💾 Gespeichert auf Platz ' + (i + 1) + ': ' + name, 'good');
}
function readSlot(i) { try { const d = JSON.parse(localStorage.getItem(slotKey(i))); return d && d.v === 1 ? d : null; } catch (e) { return null; } }
function delSlot(i) {
  const slots = readSlots(); slots[i] = null;
  try { localStorage.removeItem(slotKey(i)); localStorage.setItem(SLOTS_KEY, JSON.stringify(slots)); } catch (e) { /* ignore */ }
  if (curSlot === i) curSlot = null;
}
function loadSlot(i) {
  const d = readSlot(i);
  if (!d) { setHint('Dieser Spielstand ist nicht lesbar.', 'err'); return; }
  const name = readSlots()[i].name;
  startGame(d, i, name); toast('📂 Geladen: ' + name, 'good');
}
function openLoad() {
  const slots = readSlots();
  const rows = slots.map((m, i) => m ? slotRow(m, i, 'loadSlot', false, `<span class="del" data-act="delSlot" data-slot="${i}" title="Löschen">🗑</span>`) : '').join('');
  openPanel(`<h3>Laden<button class="close" data-act="close">✕</button></h3>`
    + (rows ? `<div class="slots">${rows}</div><p>Antippen, dann nochmal = laden. Der Tag beginnt um 06:00.</p>` : '<p>Noch nichts gespeichert – im Menü über 💾 Speichern.</p>'), 'load');
}
// developer towers (dev-saves.js, built by tool/dev_towers.js): load like a slot, but into no slot
const devPop = d => d.rooms.reduce((n, r) => n + (r.occupied ? TowerEngine.capOf(r) : 0), 0);
function openDev() {
  const rows = window.TOWER_DEV_SAVES.map((t, i) => `<button class="slot" data-act="devLoad" data-dev="${i}"><span class="nr">🛠</span>`
    + `<span class="nm"><b>${esc(t.name)}</b><small>${esc(t.sub)} · ${gameLine({ day: t.data.day, money: t.data.money, stars: t.data.stars, starsFrom: t.data.starsFrom, pop: devPop(t.data) })}</small></span></button>`).join('');
  openPanel(`<h3>Entwickler<button class="close" data-act="close">✕</button></h3><div class="slots">${rows}</div>`
    + '<p>Antippen, dann nochmal = laden. Ersetzt das laufende Spiel und „Fortsetzen“, die Speicherplätze bleiben.</p>', 'dev');
}
function loadDev(i) {
  const t = window.TOWER_DEV_SAVES[i];
  startGame(JSON.parse(JSON.stringify(t.data)), null, t.name); toast('🛠 Geladen: ' + t.name, 'good');

// replaces the running game (new: data null); the autosave follows at once, so „Fortsetzen“ means this game
function startGame(data, slot, name) {
  game = new Game(data); hook(game); curSlot = slot; curName = name || '';
  save(game);
  closePanel(); closeStart(); setTool('inspect'); resetView(); lastSeason = null;
  if (openGroup) showGroup(openGroup);
  if (!data) toast('🏗️ ' + curName + ' – viel Spaß!', 'good');
}

      + (auto ? `<button class="big main" data-sa="continue">▶ Fortsetzen<small>${autoName ? esc(autoName) + ' · ' : ''}${gameLine({ day: auto.day, money: auto.money, stars: auto.stars, starsFrom: auto.starsFrom })}</small></button>` : '')
      + `<button class="big${auto ? '' : ' main'}" data-sa="new">＋ Neues Spiel<small>Turm benennen und loslegen</small></button>`
      + `<button class="big${n ? '' : ' dis'}" data-sa="load">📂 Laden<small>${n ? n + (n === 1 ? ' gespeichertes Spiel' : ' gespeicherte Spiele') : 'noch nichts gespeichert'}</small></button>`;
  }
  startBox.innerHTML = h; startEl.hidden = false;
  const inp = document.getElementById('towerName');
  if (inp) { inp.focus(); inp.select(); inp.onkeydown = e => { if (e.key === 'Enter') newTower(); }; }
}
function newTower() {
  const inp = document.getElementById('towerName');
  const name = inp.value.trim();
  if (!name) { inp.focus(); inp.placeholder = 'Bitte einen Namen eingeben'; return; }
  startGame(null, null, name);
}
startEl.addEventListener('click', e => {
  const b = e.target.closest('[data-sa],[data-act]'); if (!b) return;
  const a = b.dataset.sa || b.dataset.act;
  if (a === 'continue') closeStart();
  else if (a === 'new') openStart('new');
  else if (a === 'go') newTower();
  else if (a === 'resume') closeStart();
  else if (a === 'load') { if (!b.classList.contains('dis')) openStart('load'); }
  else if (a === 'home') openStart();
  else if (a === 'sLoad') loadSlot(+b.dataset.slot);
});

// below, which draws the flat whole-tower look and keeps every floor whole device px high.

    else setHint(r.reason, 'err');
  } else if (g.kind === 'room') {
    const r = game.buildRoom(g.type, g.f, g.x);
    if (r.ok) { setHint(`Gebaut: ${CFG.rooms[g.type].label} ${floorName(g.f)} (−${euro(r.cost)})`, 'go'); ghost = isMouse ? makeGhost(c) : null; }
    else setHint(r.reason, 'err');
  } else if (g.kind === 'link') {
    const r = game.buildLink(g.type, g.f, g.x);
    if (r.ok) { setHint(`Gebaut: ${CFG.links[g.type].label} ${floorName(g.f)} ↔ ${floorName(g.f + 1)} (−${euro(r.cost)})`, 'go'); ghost = isMouse ? makeGhost(c) : null; }
