    if (o.cars) outlineRect(o.c, floorTop(o.f1), 1, (o.f1 - o.f0 + 1) * FH, '#ffd23f');
    else if (o.kind === 'stairs' || o.kind === 'escalator') drawLinkOutline(o.f, o.x, o.w, '#ffd23f');
    else if (o.type || o.isShell) outlineRect(o.x, floorTop(o.f), o.w, FH, '#ffd23f');
  }

  // ghost
  if (ghost && !rc.block) drawGhost(ghost, rc);
}

// people waiting at a full provider stand on its tiles (render.js only draws elevator queues)
function drawVisitQueues(rc) {
  if (!rc || !STYLE.person) return;
  for (const list of Object.values(game.providers || {})) for (const r of list) {
    if (!r.queue.length || r.f < rc.fBot || r.f > rc.fTop) continue;
    const n = Math.min(r.queue.length, Math.max(1, Math.floor((r.w - 0.4) / 0.42)));
    for (let k = n - 1; k >= 0; k--) {
      const p = r.queue[k], wait = (game.t - p.waitStart) / 60;
      STYLE.person(rc, r.x + 0.3 + k * 0.42, r.f, { id: p.id, mode: 'wait', wait, level: wait >= 10 ? 2 : wait >= 5 ? 1 : 0, front: k === 0, dir: 1 });
    }
  }
}

// selected office/flat: every provider coloured by what it gives this room (tint), penalty sources red
// (mark); selected disturber: the rooms it reaches. Hooks of the style (TOWER-a0006 G), else a frame.
function drawNeedsOverlay(rc) {
  const si = selInfo;
  if (!rc || !si || si.room !== selected) return;
  const frame = (r, col) => outlineRect(r.x, floorTop(r.f), r.w, FH, col);
  const shareCol = s => s == null ? '#8e939a' : s >= 0.8 ? '#3fa65a' : s >= 0.5 ? '#e8c040' : '#d8483a';
  if (si.shares) for (const e of si.shares) {
    if (!e.room) continue;                       // the street (entrance) has no room to colour
    if (STYLE.tint) STYLE.tint(rc, e.room, e.share); else frame(e.room, shareCol(e.share));
  }
  for (const e of si.sources || si.area || []) { if (STYLE.mark) STYLE.mark(rc, e.room, e.pen); else frame(e.room, '#ff4d5e'); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// people on the move: 0 fresh, 1 tired (< 50 % of their own maximum), 2 exhausted (< 25 %)
function tiredLevel(p) {
  const e = p.energy / p.eMax;
  return e >= CFG.energy.tiredBelow ? 0 : e >= CFG.energy.tiredBelow / 2 ? 1 : 2;
}

// 2 px frame on whole device pixels around a world rectangle (tiles)
function outlineRect(x, y, w, h, col) {
  const r = v => Math.round(v * dpr) / dpr;
  const x0 = r(sx(x)), y0 = r(sy(y)), x1 = r(sx(x + w)), y1 = r(sy(y + h));
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.strokeRect(x0 + 1, y0 + 1, x1 - x0 - 2, y1 - y0 - 2);
}

// diagonal band from the floor of f (left) to the floor of f+1 (right), as an outline
function drawLinkOutline(f, x, w, col) {
  const yb = floorTop(f) + FH - 0.08, yt = floorTop(f + 1) + FH - 0.08, th = 0.32;
  ctx.beginPath();
  ctx.moveTo(sx(x), sy(yb)); ctx.lineTo(sx(x + w), sy(yt));
  ctx.lineTo(sx(x + w), sy(yt + th)); ctx.lineTo(sx(x), sy(yb + th)); ctx.closePath();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
}

function drawGhost(g, rc) {
  // disturber (workshop, Kita, supermarket, fitness, restaurant): its penalty radius and the rooms it hits
  if (g.kind === 'room' && CFG.noise[g.type]) {
    if (g.area === undefined) g.area = game.penaltyArea(g.type, g.f, g.x);
    if (rc && STYLE.radius) STYLE.radius(rc, { type: g.type, f: g.f, x: g.x, w: g.w, r: CFG.noise[g.type].r }, g.area);
    else for (const h of g.area) outlineRect(h.room.x, floorTop(h.room.f), h.room.w, FH, '#ff4d5e');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  ctx.lineWidth = 2;
  if (g.kind === 'link') {
    drawLinkOutline(g.f, g.x, g.w, g.chk.ok ? '#7ee0a8' : '#ff4d5e');
    return;
  }
  if (g.kind === 'room' || g.kind === 'shell') {
    ctx.fillStyle = g.chk.ok ? 'rgba(126,224,168,.45)' : 'rgba(255,77,94,.45)';
    ctx.strokeStyle = g.chk.ok ? '#7ee0a8' : '#ff4d5e';
    const y0 = floorTop(g.f) + 0.08;
    ctx.fillRect(sx(g.x), sy(y0), g.w * view.s, (FH - 0.08) * view.s);
    ctx.strokeRect(sx(g.x), sy(y0), g.w * view.s, (FH - 0.08) * view.s);
  } else if (g.kind === 'shaft') {
    const ok = g.start || g.chk.ok;
    ctx.fillStyle = ok ? 'rgba(126,224,168,.45)' : 'rgba(255,77,94,.45)';
    ctx.strokeStyle = ok ? '#7ee0a8' : '#ff4d5e';
    ctx.fillRect(sx(g.c), sy(floorTop(g.f1)), view.s, (g.f1 - g.f0 + 1) * FH * view.s);
    ctx.strokeRect(sx(g.c), sy(floorTop(g.f1)), view.s, (g.f1 - g.f0 + 1) * FH * view.s);
  } else if (g.kind === 'demolish') {
    const o = g.o;
    ctx.strokeStyle = '#ff4d5e'; ctx.fillStyle = 'rgba(255,77,94,.35)';
    if (o.cars) { ctx.fillRect(sx(o.c), sy(floorTop(o.f1)), view.s, (o.f1 - o.f0 + 1) * FH * view.s); }
    else { ctx.fillRect(sx(o.x), sy(floorTop(o.f)), o.w * view.s, FH * view.s); }
  }
  if (anchor && CFG.shafts[tool]) {
    ctx.strokeStyle = '#ffd23f';
    ctx.strokeRect(sx(anchor.c), sy(floorTop(anchor.f)), view.s, FH * view.s);
  }
}

// ---------- loop ----------
let last = performance.now(), panelTick = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (speed > 0 && startEl.hidden) {   // the game stands still behind the start screen
    try { game.step(dt * BASE_RATE * speed); }
    catch (err) { speed = 0; console.error(err); setHint('Fehler in der Simulation: ' + err.message, 'err'); }
  }
  draw();
  if (window.TowerAudio) TowerAudio.frame(game, view, cssW, cssH, FH, speed);
  updateHeader();
  panelTick += dt;
  if (panelTick > 0.5 && panelMode === 'obj' && selected) { panelTick = 0; renderObjPanel(); }
  else if (panelTick > 0.5 && panelMode === 'money') { panelTick = 0; openMoney(); }
  else if (panelTick > 0.5 && panelMode === 'stars') { panelTick = 0; openStars(); }
  requestAnimationFrame(frame);
}
resize();
setTool('inspect');
openStart();
requestAnimationFrame(frame);
</script>
</body>
