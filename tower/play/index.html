const KEY = "tower-web-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.rounds },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function run(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const g = $("game");
  g.src = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  g.style.display = "block"; $("f").hidden = true;
  g.onload = () => g.focus();
}
async function stored() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw || JSON.parse(raw).v !== P.v) return null;
    return crypto.subtle.importKey("raw", b64(JSON.parse(raw).k), "AES-GCM", true, ["decrypt"]);
  } catch (e) { return null; }
}
$("f").onsubmit = async ev => {
  ev.preventDefault();
  $("go").disabled = true; $("msg").textContent = "";
  try {
    const key = await keyFrom($("pw").value.trim());
    await run(key);
    if ($("keep").checked) {
      const k = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
      try { localStorage.setItem(KEY, JSON.stringify({ v: P.v, k })); } catch (e) { /* private window */ }
    }
  } catch (e) {
    $("msg").textContent = "Das Passwort stimmt nicht.";
    $("go").disabled = false; $("pw").select();
  }
};
(async () => {
  const key = await stored();
  if (key) { try { await run(key); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (x) {} } }
  $("f").hidden = false; $("pw").focus();
})();
</script>
